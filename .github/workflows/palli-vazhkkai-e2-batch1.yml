name: Palli Vazhkkai E2 Batch 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/palli-vazhkkai-e2-batch1.yml'
      - 'scripts/palli_vazhkkai_e2_batch1.py'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply E2 batch 1
        run: python3 scripts/palli_vazhkkai_e2_batch1.py
      - name: Commit E2 review progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/palli-vazhkkai/translation-en.md speeches/palli-vazhkkai/translation-review.md speeches/palli-vazhkkai/metadata.json speeches/palli-vazhkkai/README.md speeches/palli-vazhkkai/HANDOVER.md
          git diff --cached --quiet && exit 0
          git commit -m "Review Palli Vazhkkai E2 PDF 6-10"
          git push
