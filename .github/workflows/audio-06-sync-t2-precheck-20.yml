name: Sync Audio 06 T2 precheck state 20

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-20.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=20
          pre['latest_completed_range']='13:15-14:00'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-20-13-15-14-00-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Nineteen preparatory T2 records now exist:', 'Twenty preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-19-12-49-13-15-precheck.md` — negative-evidence recovery of the machine-collapse interval before the retired postal-official house-sale narrative.\n'
          add='- `t2-batches/batch-20-13-15-14-00-precheck.md` — retired senior official / house sale, locality-agraharam objections, and the meeting sequence before the `14:00` remark.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 20 gives a much fuller machine-supported skeleton for `13:15–14:00`: a retired senior official sells the house; Karunanidhi attempts to buy it; a locality rendered with `பெரிய அக்கிரகாரம்` objects with questions resembling `கருணாநிதியா? அவனுக்கா?`; residents who had not seen him want to see him first; and the seller/elder arranges an occasion leading into the `14:00` mild-personality remark. Crucially, machine `ததாலிவாக்காகிலே`, `தயுத்த பழம்`, `கோவாலவரம்`, the third resident question, and the invitation/meeting syntax remain corrupted and are not normalized. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Nineteen preparatory records are complete:', 'Twenty preparatory records are complete:', 1)
          needle='19. `t2-batches/batch-19-12-49-13-15-precheck.md`.\n'
          add='20. `t2-batches/batch-20-13-15-14-00-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twentieth precheck covers `13:15–14:00`. It maps the retired-official house-sale narrative, the `பெரிய அக்கிரகாரம்` resident objections and the arranged meeting before the `14:00` remark, but leaves the department, personal name/title, locality form, third objection and invitation/meeting wording for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 14:00'
          git push origin main
