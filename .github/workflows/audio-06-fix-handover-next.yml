name: Fix Audio 06 handover checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-fix-handover-next.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix current handover checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Genuine direct-listening state is now **2 checked / 1 passed**. The first main-speech segment passed, while the announcer lead-in remains partly unresolved; the complete opening gate, ending and `recording_truncated` remain unresolved.',
                      'Genuine direct-listening state is now **12 checked / 4 passed**. The main-speech opening and three later ranges have passed, while the announcer lead-in and several localized phrases remain partly unresolved; the complete opening gate, ending and `recording_truncated` remain unresolved.',1)
          s=s.replace('Batch 43 (`00:00–01:10`) is the first genuine T2 audit record. It confirms the quiet interval, main-speech onset at approximately `00:41.9`, first word `கலைவாணருடைய`, and the first complete main-speech sentence including `படையலை` and `மிகையாகாது`. The separate announcer lead-in was replayed but still contains two short unresolved phrases, so the opening gate is not complete. Cumulative state: **2 checked / 1 passed**.\n\nRecord: `t2-batches/batch-43-direct-listening-audit-00-00-01-10.md`.',
                      'Batch 43 (`00:00–01:10`) established the first genuine T2 checkpoint and confirmed the main-speech opening. Records 44–53 then completed the first user-directed 10-batch iteration through `09:25`. Cumulative state is now **12 checked / 4 passed**; checked-but-unresolved phrases remain on the retry list and the opening gate is not yet complete.\n\nRecords: `t2-batches/batch-43-direct-listening-audit-00-00-01-10.md` through `t2-batches/batch-53-direct-listening-audit-08-38-09-25.md`.',1)
          s=s.replace('Continue **T2 strict direct listening with `01:10–02:20`** using the checksum-matching controlling MP3. Retain the partly unresolved `00:00–00:14` lead-in as a mandatory opening-gate retry before T2 closure.',
                      'Continue **T2 strict direct listening with the next 10-batch iteration: precheck ranges 12–21 (`09:25–14:15`)** using the checksum-matching controlling MP3. Retain the partly unresolved `00:00–00:14` lead-in and all checked-but-not-passed phrases as mandatory retries before T2 closure.',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit handover fix
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Align Audio 06 handover with T2 checkpoint'
          git push origin main
