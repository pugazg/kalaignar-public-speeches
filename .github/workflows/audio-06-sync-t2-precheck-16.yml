name: Sync Audio 06 T2 precheck state 16

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-16.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=16
          pre['latest_completed_range']='11:20-12:00'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-16-11-20-12-00-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Fifteen preparatory T2 records now exist:', 'Sixteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-15-10-48-11-20-precheck.md` — Anna-call rhetoric, immediate artist response, and the professional-career fear contrast.\n'
          add='- `t2-batches/batch-16-11-20-12-00-precheck.md` — memories/assembled-artists transition, Kannadasan changed-position wording, and opening Krishna wordplay.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 16 supports the `எனக்கு எவ்வளவோ நினைவுகள் / எத்தனையோ பசுமையான எண்ணங்கள்` transition, a candidate assembled-artists address resembling `இங்கு வீற்றிருக்கின்ற கலை உலகப் பெருமக்கள்`, Sivaji's `கிருஷ்ணனை நாம் பாராட்ட வேண்டும்` remark, and the contrast that Krishna's condition is not so pitiable. It also exposes a major conflict: current T1 `வேறு விரக்தியிலே... பல்வேறு விரக்திகளை...` versus machine `வேறொரு இயக்கத்திலே... வேறொரு கொள்கையை...`, plus `அந்தக் கிருஷ்ணன்` versus machine `ஸ்ரீகிருஷ்ணன்`. These remain for true audible replay; no canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Fifteen preparatory records are complete:', 'Sixteen preparatory records are complete:', 1)
          needle='15. `t2-batches/batch-15-10-48-11-20-precheck.md`.\n'
          add='16. `t2-batches/batch-16-11-20-12-00-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe sixteenth precheck covers `11:20–12:00`. It supports the memories transition, a candidate assembled-artists address, Sivaji's Krishna remark and the not-so-pitiable Krishna contrast, but leaves the major `விரக்தி / இயக்கம் / கொள்கை` wording conflict, the Sivaji reporting verb, and `கிருஷ்ணன் / ஸ்ரீகிருஷ்ணன்` form for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 12:00'
          git push origin main
