name: Sync Audio 06 T2 precheck state 19

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-19.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=19
          pre['latest_completed_range']='12:49-13:15'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-19-12-49-13-15-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eighteen preparatory T2 records now exist:', 'Nineteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-18-12-22-12-49-precheck.md` — house-purchase correction and mock-newspaper sequence, including corrupted political-status, place-name and mock-headline forms.\n'
          add='- `t2-batches/batch-19-12-49-13-15-precheck.md` — negative-evidence recovery of the machine-collapse interval before the retired postal-official house-sale narrative.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 19 revisits the previously withheld `12:49–13:15` interval. Fresh semantic retrieval produced no stable passage, and exact-anchor checks recover only the post-collapse boundary (`ஓய்வு பெற்றவர்`, `அந்த வீட்டை விற்க`, `வாங்குவதற்காக நான் முயற்சித்த`) rather than trustworthy words inside the gap. The cleaner `தபால் இலாகாவிலே` form is not preserved by the attachment transcript. The entire 26-second interval therefore remains withheld; no bridge was reconstructed from narrative context and no canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eighteen preparatory records are complete:', 'Nineteen preparatory records are complete:', 1)
          needle='18. `t2-batches/batch-18-12-22-12-49-precheck.md`.\n'
          add='19. `t2-batches/batch-19-12-49-13-15-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe nineteenth precheck covers `12:49–13:15` as negative evidence. Fresh retrieval did not recover stable interior text; only the later retired-official / house-sale / attempted-purchase boundary is machine-detectable. The whole interval remains withheld and must be replayed directly from the controlling MP3 before any Tamil is inserted. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 13:15'
          git push origin main
