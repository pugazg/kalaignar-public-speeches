name: Palli Vazhkkai E2 Remaining

on:
  push:
    paths:
      - '.github/workflows/palli-vazhkkai-e2-remaining.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply E2 remaining review
        run: python scripts/palli_vazhkkai_e2_remaining.py
      - name: Commit E2 review completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/palli-vazhkkai/translation-en.md speeches/palli-vazhkkai/translation-review.md speeches/palli-vazhkkai/metadata.json speeches/palli-vazhkkai/README.md speeches/palli-vazhkkai/HANDOVER.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete Palli Vazhkkai E2 review PDF 41-81"
          git push
