name: Sync Audio 06 T2 precheck state 09

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-09.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=9
          pre['latest_completed_range']='07:12-08:00'
          pre['records']=[
              't2-batches/batch-01-00-00-01-10-precheck.md',
              't2-batches/batch-02-01-10-02-34-precheck.md',
              't2-batches/batch-03-02-34-03-22-precheck.md',
              't2-batches/batch-04-03-22-04-00-precheck.md',
              't2-batches/batch-05-04-00-05-14-precheck.md',
              't2-batches/batch-06-05-14-06-00-precheck.md',
              't2-batches/batch-07-06-00-06-43-precheck.md',
              't2-batches/batch-08-06-43-07-12-precheck.md',
              't2-batches/batch-09-07-12-08-00-precheck.md'
          ]
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eight preparatory T2 records now exist:', 'Nine preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-08-06-43-07-12-precheck.md` — Rajendran reference and Kalaivanar\'s early progressive / Self-Respect ideas.\n'
          add='- `t2-batches/batch-09-07-12-08-00-precheck.md` — Ilangovan, Kannagi adaptation, *Dravida Nadu* article/title and opening of Anna\'s assessment.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 9 strongly supports the Ilangovan/Kannagi/*Dravida Nadu* sequence and supplies useful machine candidates, including `தனிகாசலம் என்கின்ற இளங்கோவன்`, machine `இஞ்சிப் பத்தரை மேல்`, and the stable later praise `வசன நடையில் ஒரு புதிய சகாப்தத்தை இளங்கோவன் உருவாக்கியிருக்கிறார்`. Exact replay must settle the personal-name expansion, `போற்றுதலுக்கும் புகழுதலுக்கும்` wording, `ஆக்கினாரே/ஆக்கினார்கள்`, whether the publication relation is `நடத்திய` or machine `எழுதிய`, the exact article-title segmentation, the article-opening setup, and two badly corrupted praise phrases resembling `பத்திவாய்ந்த எழுத்தாளர்` and `அவருடைய எழுதுவோலி தமிழ் நர்த்தனம் ஆடுகிறது`. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eight preparatory records are complete:', 'Nine preparatory records are complete:', 1)
          needle='8. `t2-batches/batch-08-06-43-07-12-precheck.md`.\n'
          add='9. `t2-batches/batch-09-07-12-08-00-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe ninth precheck covers `07:12–08:00`. It supports the Ilangovan/Kannagi/*Dravida Nadu* sequence and records machine candidates for the unresolved personal name, article title and opening praise, but leaves all exact lexical choices—including the corrupted first two praise phrases—for true audible replay.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 08:00'
          git push origin main
