name: Sync Audio 06 T2 precheck state 11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-11.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=11
          pre['latest_completed_range']='08:38-09:25'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-11-08-38-09-25-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ten preparatory T2 records now exist:', 'Eleven preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-10-08-00-08-38-precheck.md` — Anna\'s criticism of Ilangovan\'s *Silappathikaram* treatment.\n'
          add='- `t2-batches/batch-11-08-38-09-25-precheck.md` — `இஞ்சிப்பத்தர்` gold/brass deception and Anna\'s interpretation of Kalaivanar\'s performance.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 11 strongly supports the `இஞ்சிப்பத்தர்` role, the gold/brass substitution scheme, and the interpretation that Kalaivanar's acting exposes Ilangovan's treatment of *Silappathikaram*. Exact replay must settle `இஞ்சிப்பத்தராக/இஞ்சிப் பத்தராக`, full `என். எஸ். கிருஷ்ணன்` versus `என்.எஸ்.கே.`, the clause order around gold, brass and theft, `ஒருவனாக/ஒருவராக`, current `பித்தளைக்கு நிறம் ஏற்றி` versus machine `பித்தளைக்கு நிகரேற்றி`, and concluding honorific/name morphology. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ten preparatory records are complete:', 'Eleven preparatory records are complete:', 1)
          needle='10. `t2-batches/batch-10-08-00-08-38-precheck.md`.\n'
          add='11. `t2-batches/batch-11-08-38-09-25-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe eleventh precheck covers `08:38–09:25`. It strongly supports the `இஞ்சிப்பத்தர்` gold/brass-deception narrative and Anna's interpretive comparison, but leaves exact gold/brass clause order, `நிறம் ஏற்றி/நிகரேற்றி`, Kalaivanar name form and honorific morphology for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 09:25'
          git push origin main
