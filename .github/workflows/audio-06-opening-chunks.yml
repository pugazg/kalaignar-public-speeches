name: Audio 06 opening chunk navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-opening-chunks.yml

permissions:
  contents: read

jobs:
  opening-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper
      - name: Download and verify
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://tamildigitallibrary.in/kalaignar/audio/06.Kalavaivannar%20N.S.Krishnnan%20Ninavul%20Naal%20Vizha%20Vil%20Kaligar%20Speech.mp3' \
            -o source.mp3
          echo '6f0149229196b1d6df092d9fee006253591afec7ba9512bfbeb46dd0ab82c836  source.mp3' | sha256sum -c
          ffmpeg -hide_banner -loglevel error -y -i source.mp3 -af 'pan=mono|c0=c1' -ar 16000 -c:a pcm_s16le right.wav
      - name: Transcribe independent opening chunks
        run: |
          cat > opening.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import subprocess, json

          out=Path('audio-06-opening-chunks'); out.mkdir(exist_ok=True)
          chunks=[(0,60),(60,120),(120,180),(180,240)]
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8')
          combined=[]
          for i,(start,end) in enumerate(chunks):
              wav=out/f'chunk-{i:02d}-{start:03d}-{end:03d}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i','right.wav','-t',str(end-start),'-c:a','pcm_s16le',str(wav)],check=True)
              segs,info=model.transcribe(str(wav),language='ta',task='transcribe',beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=False,vad_filter=False,word_timestamps=True)
              rows=[]; lines=[]
              for s in segs:
                  st=s.start+start; en=s.end+start; text=s.text.strip()
                  lines.append(f'[{st:08.2f}-{en:08.2f}] {text}')
                  row={'start':st,'end':en,'text':text,'avg_logprob':s.avg_logprob,'no_speech_prob':s.no_speech_prob}
                  if s.words:
                      row['words']=[{'start':w.start+start,'end':w.end+start,'word':w.word,'probability':w.probability} for w in s.words]
                  rows.append(row); combined.append(row)
              (out/f'chunk-{i:02d}-{start:03d}-{end:03d}.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
              (out/f'chunk-{i:02d}-{start:03d}-{end:03d}.json').write_text(json.dumps({'segments':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'combined.txt').write_text('\n'.join(f"[{r['start']:08.2f}-{r['end']:08.2f}] {r['text']}" for r in combined)+'\n',encoding='utf-8')
          print((out/'combined.txt').read_text(encoding='utf-8'))
          PY
          python opening.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-06-opening-chunks
          path: audio-06-opening-chunks/
          retention-days: 5
