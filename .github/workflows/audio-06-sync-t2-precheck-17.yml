name: Sync Audio 06 T2 precheck state 17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-17.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=17
          pre['latest_completed_range']='12:00-12:22'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-17-12-00-12-22-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Sixteen preparatory T2 records now exist:', 'Seventeen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-16-11-20-12-00-precheck.md` — memories/assembled-artists transition, Kannadasan changed-position wording, and opening Krishna wordplay.\n'
          add='- `t2-batches/batch-17-12-00-12-22-precheck.md` — Kannadasan Krishna recommendation, central Krishna-joke conflict, temple-house remark and house-correction boundary.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 17 supports Kannadasan's `நீ கிருஷ்ணனை ஏற்றுக்கொள்` recommendation, `பரமாத்மா கிருஷ்ணன்`, the reported `கிருஷ்ண பரமாத்மா` temple-house remark and a strong connective candidate `இது போதாதா எதிரிகளுக்கு?` before `நான் வீடு கட்டவில்லை`. It exposes a major central conflict: current T1 `அவருடைய பெருமதிப்புக்கு இலக்காக இருப்பதாக` versus machine `அவ்வளவு பரிதாபத்துக்குரிய நிலையில் இருப்பதாகவும்`, plus `அருகாமையிலே / அருகாமையிலேதான்`. These remain for true audible replay; no canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Sixteen preparatory records are complete:', 'Seventeen preparatory records are complete:', 1)
          needle='16. `t2-batches/batch-16-11-20-12-00-precheck.md`.\n'
          add='17. `t2-batches/batch-17-12-00-12-22-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe seventeenth precheck covers `12:00–12:22`. It supports the Kannadasan Krishna recommendation and temple-house sequence, but leaves the major `பெருமதிப்பு / பரிதாபம்` conflict, `பரமாத்மா கிருஷ்ணன் / கிருஷ்ண பரமாத்மா` occurrence forms, `அருகாமையிலே / அருகாமையிலேதான்`, and `இது போதாதா எதிரிகளுக்கு?` for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 12:22'
          git push origin main
