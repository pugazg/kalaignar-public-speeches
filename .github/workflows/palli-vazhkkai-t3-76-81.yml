name: Palli Vazhkkai T3 PDF 76-81

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/palli-vazhkkai-t3-76-81.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate PDF 76-81 into canonical Tamil
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('speeches/palli-vazhkkai')
          canonical_path = root / 'transcription-ta.md'
          canonical = canonical_path.read_text(encoding='utf-8')
          staged = (root / 't1-batches/batch-12-pdf-71-81.md').read_text(encoding='utf-8')

          assert '### PDF page 75 — printed page 74' in canonical
          assert '### PDF page 76 — printed page 75' not in canonical

          page_re = re.compile(r'^### PDF page (\d+) — printed page (\d+)\n\n', re.M)
          ms = list(page_re.finditer(staged))
          pages = {}
          for i, m in enumerate(ms):
              p = int(m.group(1)); pr = int(m.group(2))
              if p < 76:
                  continue
              end = ms[i+1].start() if i + 1 < len(ms) else len(staged)
              pages[p] = [pr, staged[m.end():end].strip()]

          assert sorted(pages) == list(range(76, 82)), sorted(pages)
          assert all(pages[p][0] == p - 1 for p in pages)

          def repl(p, old, new, n=1):
              body = pages[p][1]
              c = body.count(old)
              assert c == n, f'PDF {p}: expected {n} of {old!r}, found {c}'
              pages[p][1] = body.replace(old, new, n)

          # T2 Batch 15 — PDF 76-80
          repl(76, 'அவனுகத்தான்', 'அவனாகத்தான்')
          repl(77, 'ஒவ்வொரு வனுக்கும்', 'ஒவ்வொருவனுக்கும்')
          repl(77, 'எய்ப்பது', 'ஏய்ப்பது')
          repl(78, 'நாட்டெங்கும்', 'நாடெங்கும்')
          repl(80, 'தேவனே நம்பு!', 'தேவனை நம்பு!')

          # T2 Batch 16 — PDF 81
          repl(81, 'தமிழமெல்லாம்', 'தமிழரெல்லாம்')
          repl(81, 'தமிழனத்தை', 'தமிழினத்தை')

          # Verified split-word page-boundary joins.
          assert pages[76][1].endswith('வாழ்வின் எல்லாத் துறை')
          assert pages[77][1].startswith('களிலும், ')
          pages[76][1] = pages[76][1][:-len('துறை')] + 'துறைகளிலும்,'
          pages[77][1] = pages[77][1][len('களிலும், '):]

          assert pages[77][1].endswith('தகுதியை')
          assert pages[78][1].startswith('யும், ')
          pages[77][1] = pages[77][1][:-len('தகுதியை')] + 'தகுதியையும்,'
          pages[78][1] = pages[78][1][len('யும், '):]

          assert pages[78][1].endswith('உணவுப் பஞ்சம் ஏற்பட்')
          assert pages[79][1].startswith('டது, நாட்டில்!')
          pages[78][1] = pages[78][1][:-len('ஏற்பட்')] + 'ஏற்பட்டது,'
          pages[79][1] = pages[79][1][len('டது, '):]

          assert pages[79][1].endswith('வாழமுடியாதவர்களாகவே விளங்குகின்ற')
          assert pages[80][1].startswith('னர். ')
          pages[79][1] = pages[79][1][:-len('விளங்குகின்ற')] + 'விளங்குகின்றனர்.'
          pages[80][1] = pages[80][1][len('னர். '):]

          # PDF 75→76 and 80→81 are ordinary phrase/sentence continuations.

          segment = '\n\n'.join(
              f"### PDF page {p} — printed page {p-1}\n\n{pages[p][1]}"
              for p in range(76, 82)
          )

          stale = [
              'அவனுகத்தான்', 'ஒவ்வொரு வனுக்கும்', 'எய்ப்பது', 'நாட்டெங்கும்',
              'தேவனே நம்பு!', 'தமிழமெல்லாம்', 'தமிழனத்தை',
              'வாழ்வின் எல்லாத் துறை\n\n### PDF page 77',
              'தகுதியை\n\n### PDF page 78',
              'உணவுப் பஞ்சம் ஏற்பட்\n\n### PDF page 79',
              'விளங்குகின்ற\n\n### PDF page 80'
          ]
          for s in stale:
              assert s not in segment, f'stale reading survived: {s}'

          required = [
              'அவனாகத்தான்', 'ஒவ்வொருவனுக்கும்', 'ஏய்ப்பது', 'நாடெங்கும்',
              'தேவனை நம்பு!', 'தமிழரெல்லாம்', 'தமிழினத்தை',
              'வாழ்வின் எல்லாத் துறைகளிலும்,', 'தகுதியையும்,',
              'உணவுப் பஞ்சம் ஏற்பட்டது,', 'வாழமுடியாதவர்களாகவே விளங்குகின்றனர்.',
              'உலகியலேக் காண',
              'பள்ளி வாழ்க்கையில்! வணக்கம் !!'
          ]
          for s in required:
              assert s in segment, f'required verified form missing: {s}'

          # Update verification header without freezing the layer yet.
          canonical = canonical.replace(
              '**Status:** `t3-in-progress` — canonical consolidation through **PDF 75 / printed page 74**',
              '**Status:** `t3-in-progress` — canonical consolidation complete through **PDF 81 / printed page 80**; whole-body T3 gate pending'
          )
          canonical = canonical.replace(
              '- This canonical file currently contains the T2-corrected consolidated segment **PDF 6-75 / printed 5-74**. PDF 76-81 remains in the source-controlled T1 staging batch until the final T3 merge step.',
              '- This canonical file now contains the T2-corrected consolidated text for **all PDF 6-81 / printed 5-80**. The whole-body stale-reading, page-continuity, heading-count and endpoint checks are still pending before freeze.'
          )
          marker = 'The third T3 consolidation pass incorporates PDF 61-75 / printed 60-74. All scan-proven T2 Batch 12-14 corrections are applied, including traditional-glyph mappings such as `மனிதனாக`, `மாட்டானா`, `நன்றாக`, `தோழனாகவே`, `கெட்டிக்காரனாக`, `பெறுபவனாக`, and `தானாகவே`. Source-supported forms including `உலகந்தான்`, `தன்னுலே`, and `இதற்கேல் வாழ் பொருந்தும் முறையிலே` are retained.\n'
          addition = marker + '\nThe fourth T3 consolidation pass incorporates PDF 76-81 / printed 75-80. It applies T2 Batches 15-16, including `அவனாகத்தான்`, `ஒவ்வொருவனுக்கும்`, `ஏய்ப்பது`, `நாடெங்கும்`, `தேவனை`, `தமிழரெல்லாம்`, and `தமிழினத்தை`; resolves the verified split words `துறைகளிலும்`, `தகுதியையும்`, `ஏற்பட்டது`, and `விளங்குகின்றனர்`; and preserves source-supported wording including `உலகியலேக் காண` and the verified final closing.\n'
          assert marker in canonical
          canonical = canonical.replace(marker, addition, 1)

          canonical = canonical.rstrip() + '\n\n' + segment + '\n'

          # Structural gate for this merge only: 76 unique body headings, PDF 6..81.
          heads = [(int(a), int(b)) for a,b in page_re.findall(canonical)]
          assert len(heads) == 76, len(heads)
          assert [p for p,_ in heads] == list(range(6,82))
          assert all(pr == p-1 for p,pr in heads)
          assert canonical.rstrip().endswith('பள்ளி வாழ்க்கையில்! வணக்கம் !!')

          canonical_path.write_text(canonical, encoding='utf-8')
          PY

      - name: Commit canonical final segment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add speeches/palli-vazhkkai/transcription-ta.md
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate Palli Vazhkkai T3 through PDF 81'
          git push
