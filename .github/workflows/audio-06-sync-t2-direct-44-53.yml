name: Sync Audio 06 T2 direct audit 44-53

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-direct-44-53.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize direct-listening iteration 44-53
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          # Canonical Tamil: apply only source-heard corrections from direct replay.
          p=base/'transcription-ta.md'
          s=p.read_text(encoding='utf-8')
          reps=[
            ('**Status:** **T2 strict direct-listening audit in progress — 2 segments checked / 1 passed; opening lead-in still partly unresolved**',
             '**Status:** **T2 strict direct-listening audit in progress — 12 segments checked / 4 passed; opening lead-in still partly unresolved**'),
            ('சின்ன அண்ணாமலை அவர்கள் பேசும்போது ஒன்றைச் சொன்னார். யாருக்கும் தெரியாத ஒன்றைச் சொல்லி—',
             'சின்ன அண்ணாமலை அவர்கள் பேசும்போது ஒன்றைச் சொன்னார்கள். யாருக்கும் தெரியாத ஒன்றைச் சொல்லி, அதன் மூலமாக கலைவாணருடைய பாராட்டைப் பெற்றேன் என்று.'),
            ('கலைவாணர் இருந்தால் போய்க் கேட்கலாம், உண்மையா என்று.',
             'இருந்தால் போய்க் கேட்கலாம், உண்மையா என்று.'),
            ('நான் தனியாக உட்கார்ந்து,', 'நான் தனிமையாக உட்கார்ந்து,'),
            ('அப்போதெல்லாம் கவிஞர் கண்ணதாசன் அவர்கள் இன்னும் `[தெளிவில்லை]` நண்பர்களோடு இணைந்து, அறிஞர் அண்ணாவிடமிருந்து பிரிந்து, வேறு கட்சியைத் தொடங்கி, வேகமாக என்னைத் தாக்கிப் பேசிக்கொண்டிருந்த காலம்.',
             'அப்போதெல்லாம் கவிஞர் கண்ணதாசன் அவர்கள் இன்னொரு நண்பரோடு இணைந்து, அறிஞர் அண்ணாவிடமிருந்து பிரிந்து, வேறொரு கட்சியைத் தொடங்கி, மிக வேகமாக என்னைத் தாக்கிப் பேசிக்கொண்டிருந்த காலம்.'),
            ('நானும் அவரும் ஒருவரை ஒருவர் சந்தித்தால் பேசிக்கொள்ளாத அளவுக்குப் பகை உணர்ச்சி வளர்ந்திருந்த நேரம்.',
             'நானும் அவரும் ஒருவரை ஒருவர் சந்தித்தால்கூட பேசிக்கொள்ளாத அளவுக்குப் பகை உணர்ச்சி வளர்ந்திருந்த நேரம்.'),
            ('மேகலா பட நிறுவனத்திலே உள்ள ஒரு நண்பருக்கு', 'மேகலா பட நிர்வாகத்திலே உள்ள ஒரு நண்பருக்கு'),
            ('இடையிலே இன்னொரு பையனுடைய குரலும் கேட்டது.', 'இடையிலே இன்னொரு பழகிய குரலும் கேட்டது.'),
            ('பத்திரிகையிலே படிக்கிறாயே', 'பத்திரிகைகளில் படிக்கிறாயே'),
            ('நான் சொன்னேன்: “நன்றாகத் திட்டுகிறீர். நீர் தமிழிலே திட்டுகிற காரணத்தால், அதுவும் இனிமையான தமிழிலே திட்டுகிற காரணத்தால், அதை நான் ரசித்துக்கொண்டிருக்கிறேனே அல்லாமல், அதற்காக நான் வருத்தப்படவில்லை” என்று அவரிடத்திலே சொன்னேன்.',
             'நான் சொன்னேன்: “`[முதல் குறும் பதில் தெளிவில்லை]`, அதுவும் இனிமையான தமிழிலேயே திட்டுகிற காரணத்தால், அதை நான் ரசித்துக்கொண்டிருக்கிறேனே அல்லாமல், அதற்காக நான் வருத்தப்படவில்லை” என்று அவரிடத்திலே சொன்னேன்.'),
            ('இப்படிப் பகை உணர்ச்சியையும் மாற்றியமைக்கக்கூடிய சக்தி நம்முடைய தமிழுக்கு உண்டு; தமிழ்க் கலைக்கு உண்டு.',
             'இப்படிப் பகை உணர்ச்சியையும் மாற்றி அமைக்கக்கூடிய சக்தி நம்முடைய தமிழுக்கு உண்டு; தமிழ்க் கலைக்கு உண்டு.'),
            ('அந்தக் கலையினுடைய அருமை பெருமைகளைத் தெரிந்த காரணத்தினால்தான் பேரறிஞர் அண்ணா அவர்கள் கலை மூலமாக நல்ல கருத்துக்களை மக்களிடத்திலே சொல்ல வேண்டும் என்கின்ற பணியினை மேற்கொண்டார்.',
             'அந்தக் கலையினுடைய அருமை பெருமைகளைத் தெரிந்த காரணத்தினால்தான் பேரறிஞர் அண்ணா அவர்கள் கலை மூலமாகவும் நல்ல கருத்துக்களை மக்களுக்கு எடுத்துச் சொல்ல வேண்டும் என்கின்ற பணியினை மேற்கொண்டார்கள்.'),
            ('அந்தப் பணியினை அண்ணா அவர்கள் மேற்கொள்வதற்குப் பக்கபலமாக இருந்த ஒரு கலையுலகப் பெருமகன் யாரென்றால், அவர்தான் இன்றைக்கு இந்தப் பாமன்றத்திலே படமாகக் காட்சியளித்துக்கொண்டிருக்கின்ற கலைவாணர் என். எஸ். கிருஷ்ணன் அவர்கள்.',
             'அந்தப் பணியினை அண்ணா அவர்கள் மேற்கொள்வதற்குத் தூண்டுகோலாக இருந்த ஒரு கலையுலகப் பெருமகன் யாரென்றால், அவர்தான் இன்றைக்கு `[மன்றம்/காட்சித் தொடர் தெளிவில்லை]` கலைவாணர் என். எஸ். கிருஷ்ணன் அவர்கள்.'),
            ('லட்சிய நடிகர் எஸ். எஸ். ராஜேந்திரன் அவர்கள் குறிப்பிட்டதைப்போல், அண்ணா அவர்கள் திரைப்படத் துறையிலோ, நாடகத் துறையிலோ புரட்சிகரமான புதுமையான கருத்துக்களை, தன்மான இயக்கக் கருத்துக்களை, தமிழ்ச் சமுதாயத்திற்குத் தேவையான கருத்துக்களை எடுத்தாளுவதற்கு முன்பாகவே, கலைவாணர் என். எஸ். கிருஷ்ணன் அவர்கள் அப்படிப்பட்ட கருத்துக்களை எடுத்துச் சொன்னார்.',
             'லட்சிய நடிகர் ராஜேந்திரன் அவர்கள் குறிப்பிட்டதைப்போல், அண்ணா அவர்கள் திரைப்படத் துறையிலோ அல்லது நாடகத் துறையிலோ புரட்சிகரமான புதுமையான கருத்துக்களை, தன்மான இயக்கக் கருத்துக்களை, தமிழ்ச் சமுதாயத்திற்குத் தேவையான கருத்துக்களை எடுத்தாளுவதற்கு முன்பாகவே, கலைவாணர் என். எஸ். கே. அவர்கள் அப்படிப்பட்ட கருத்துக்களை எடுத்துச் சொன்னார்கள்.'),
            ('`[பெயரின் தொடக்கம் தெளிவில்லை]` இளங்கோவன் அவர்கள்', 'தனிகாசலம் என்கின்ற இளங்கோவன் அவர்கள்'),
            ('அந்தத் திரைப்படத்தைப் பற்றி அண்ணா அவர்கள், அவர்கள் நடத்திய திராவிட நாடு இதழிலே ஒரு நீண்ட கட்டுரையை எழுதினார்கள்.',
             'அந்தத் திரைப்படத்தைப் பற்றி அண்ணா அவர்கள், திராவிட நாடு இதழில் ஒரு நீண்ட கட்டுரையை எழுதினார்கள்.'),
            ('`[The exact personal-name expansion before “இளங்கோவன்” requires direct replay. The article-title form has improved machine convergence but remains provisional until T2.]`\n\n', ''),
            ('`[The opening words of Anna\'s quoted praise remain unresolved.]`',
             '`[முதல் குறும் பாராட்டுச் சொல்லில் ஒரு சொல் தெளிவில்லை]` எழுத்தாளர். அவருடைய எழுத்திலே தமிழ் நர்த்தனம் ஆடுகிறது.'),
            ('“வசன நடையிலே ஒரு புதிய சகாப்தத்தை இளங்கோவன் உருவாக்கியிருக்கிறார்” என்றெல்லாம் அண்ணா இளங்கோவனைப் பாராட்டிவிட்டு, “ஆனாலும் சிலப்பதிகாரத்தைப் பழைய `[தெளிவில்லை]` போலவே, புராண முறையிலேயே இளங்கோவன் எழுதியிருக்க வேண்டுமா? அது இலக்கிய வளமல்லவா? தமிழ்நாட்டு வரலாறல்லவா? சேர, சோழ, பாண்டிய மூவேந்தர் குடியின் சிறப்பை விளக்குகின்ற பனுவலல்லவா? அப்படிப்பட்ட பெரும் காப்பியத்தைப் புராண `[தெளிவில்லை]` வீணாக்கியிருக்க வேண்டுமா?” என்று அண்ணா கேட்டுவிட்டு—',
             '“வசன நடையில் ஒரு புதிய சகாப்தத்தை இளங்கோவன் உருவாக்கியிருக்கிறார்” என்றெல்லாம் அண்ணா இளங்கோவனைப் பாராட்டிவிட்டு, “ஆனாலும் சிலப்பதிகாரத்தைப் பழைய கர்ணபரம்பரைக் கதையைப் போலவே, புராண முறையிலேயே இளங்கோவன் எழுதியிருக்க வேண்டுமா? `[ஒரு குறும் வினா தெளிவில்லை]` தமிழ்நாட்டு வரலாறல்லவா? சேர, சோழ, பாண்டிய மன்னர்கள் கொண்ட சிறப்பை விளக்குகின்ற பனுவலல்லவா? அப்படிப்பட்ட பெரும் காப்பியத்தைப் புராண நெறி கொடுத்து வீணாக்கியிருக்க வேண்டுமா?” என்று அண்ணா கேட்டுவிட்டு—'),
            ('இதில் இஞ்சிப்பத்தராக வருகின்ற கலைவாணர் என். எஸ். கிருஷ்ணன் அவர்கள்', 'இதில் இஞ்சிப்பத்தராக வருகின்ற கலைவாணர் என். எஸ். கே. அவர்கள்'),
            ('மற்றவர்களுக்குக் கொடுத்து ஏமாற்றுகின்ற ஒருவனாக நடிக்கிறார்.', 'மற்றவர்களிடத்திலே கொடுத்து ஏமாற்றுகின்ற ஒருவராக நடிக்கிறார்.'),
            ('பித்தளைக்கு நிறம் ஏற்றி இளங்கோவன் தந்தார் என்பதை கலைவாணர் என். எஸ். கிருஷ்ணன் தன்னுடைய நடிப்பின் மூலமாக விளக்கியிருக்கிறார்.',
             'பித்தளைக்கு நிறமேற்றி இளங்கோவன் தந்தார் என்பதை கலைவாணர் என். எஸ். கே. அவர்கள் தன்னுடைய நடிப்பின் மூலமாக விளக்கியிருக்கிறார்.'),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('transcript marker missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Metadata.
          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          a=d.setdefault('direct_listening_audit',{})
          a['status']='in-progress'
          a['segments_checked']=12
          a['segments_passed']=4
          a['latest_checked_range']='08:38-09:25'
          recs=a.setdefault('records',[])
          new_records=[
            't2-batches/batch-44-direct-listening-audit-01-10-02-34.md',
            't2-batches/batch-45-direct-listening-audit-02-34-03-22.md',
            't2-batches/batch-46-direct-listening-audit-03-22-04-00.md',
            't2-batches/batch-47-direct-listening-audit-04-00-05-14.md',
            't2-batches/batch-48-direct-listening-audit-05-14-06-00.md',
            't2-batches/batch-49-direct-listening-audit-06-00-06-43.md',
            't2-batches/batch-50-direct-listening-audit-06-43-07-12.md',
            't2-batches/batch-51-direct-listening-audit-07-12-08-00.md',
            't2-batches/batch-52-direct-listening-audit-08-00-08-38.md',
            't2-batches/batch-53-direct-listening-audit-08-38-09-25.md',
