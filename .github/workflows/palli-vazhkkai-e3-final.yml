name: Palli Vazhkkai E3 Final

on:
  push:
    paths:
      - '.github/workflows/palli-vazhkkai-e3-final.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run E3 final verification
        run: python scripts/palli_vazhkkai_e3_final_v2.py
      - name: Commit E3 verified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/palli-vazhkkai/translation-en.md speeches/palli-vazhkkai/translation-review.md speeches/palli-vazhkkai/metadata.json speeches/palli-vazhkkai/README.md speeches/palli-vazhkkai/HANDOVER.md
          git diff --cached --quiet && exit 0
          git commit -m "Verify Palli Vazhkkai English E3"
          git push
