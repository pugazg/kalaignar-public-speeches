name: Sync Audio 06 T2 precheck state 25

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-25.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=25
          pre['latest_completed_range']='16:00-16:30'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-25-16-00-16-30-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-four preparatory T2 records now exist:'
          new='Twenty-five preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-24-15-35-16-00-precheck.md` — relief/election-fund theatre work, unstable co-actor list, and the transition into the art-and-politics reflection.\n'
          add='- `t2-batches/batch-25-16-00-16-30-precheck.md` — art serving political ideas versus art itself becoming politics, short `கலை தேவை` / `அரசியல் எண்ணங்களை` machine anchors, and the unresolved life-goal/Anna linkage.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 25 covers `16:00–16:30`. Exact-form machine probes do not preserve the current full T1 sentences, but shorter anchors recover `இப்படி அத்தனை பேரும்`, `எண்ணியவர்கள் அல்ல`, `கலை தேவை`, and `அரசியல் எண்ணங்களை`. The intervening subject/life-goal phrase and the exact Anna linkage remain unresolved; no cleaner wording is reconstructed from ideology or historical expectation. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-four preparatory records are complete:'
          new='Twenty-five preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='24. `t2-batches/batch-24-15-35-16-00-precheck.md`.\n'
          add='25. `t2-batches/batch-25-16-00-16-30-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-fifth precheck covers `16:00–16:30`. It maps the distinction between artists serving political ideas and making art itself politics, but machine evidence only preserves short conceptual anchors rather than the full T1 syntax. The missing middle subject/life-goal phrase and exact Anna reference remain for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 16:30'
          git push origin main
