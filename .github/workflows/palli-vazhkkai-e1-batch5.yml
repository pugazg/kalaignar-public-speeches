name: Palli Vazhkkai E1 Batch 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/palli-vazhkkai-e1-batch5.yml'
      - 'scripts/palli_vazhkkai_e1_batch5.py'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply E1 batch 5
        run: python3 scripts/palli_vazhkkai_e1_batch5.py
      - name: Commit translation progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speeches/palli-vazhkkai/translation-en.md speeches/palli-vazhkkai/metadata.json speeches/palli-vazhkkai/README.md speeches/palli-vazhkkai/HANDOVER.md
          git diff --cached --quiet && exit 0
          git commit -m "Translate Palli Vazhkkai E1 PDF 26-30"
          git push
