name: Fix Audio 06 stale precheck state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-fix-stale-precheck-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify textual-precheck effect after direct audit starts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          a=d.get('direct_listening_audit',{})
          if a.get('segments_checked') != 2 or a.get('segments_passed') != 1:
              raise SystemExit('live direct-listening state moved; re-fetch before patching')
          pre=d.setdefault('t2_textual_precheck',{})
          pre['direct_listening_effect']='none; textual/ASR prechecks did not increment T2 counters; current direct-listening progress is tracked separately in direct_listening_audit'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit metadata clarification
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json
          git commit -m 'Clarify Audio 06 precheck state after T2 starts'
          git push origin main
