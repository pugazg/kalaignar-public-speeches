name: Sync Audio 06 T2 precheck state 10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-10.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=10
          pre['latest_completed_range']='08:00-08:38'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-10-08-00-08-38-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Nine preparatory T2 records now exist:', 'Ten preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-09-07-12-08-00-precheck.md` — Ilangovan, Kannagi adaptation, *Dravida Nadu* article/title and opening of Anna\'s assessment.\n'
          add='- `t2-batches/batch-10-08-00-08-38-precheck.md` — Anna\'s criticism of Ilangovan\'s *Silappathikaram* treatment.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 10 exposes major ASR-versus-T1 conflicts in Anna's criticism of Ilangovan's *Silappathikaram* treatment. Machine evidence supports a candidate `கர்ணபரம்பரைக் கதையைப் போலவே`, but conflicts with the current provisional rhetorical question (`இலக்கிய வளமல்லவா?` versus machine `ஒரு இலட்சியவாதமா?`), the Chera–Chola–Pandya clause, the literary noun represented as `பனுவலல்லவா?`, and the corrupted phrase resembling `புராண நெறு கொடுத்து` before `வீணாக்கியிருக்க வேண்டுமா?`. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Nine preparatory records are complete:', 'Ten preparatory records are complete:', 1)
          needle='9. `t2-batches/batch-09-07-12-08-00-precheck.md`.\n'
          add='10. `t2-batches/batch-10-08-00-08-38-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe tenth precheck covers `08:00–08:38`. It records the machine candidate `கர்ணபரம்பரைக் கதையைப் போலவே` and the major conflicts around the following rhetorical question, the Chera–Chola–Pandya clause, `பனுவலல்லவா?`, and the corrupted phrase before `வீணாக்கியிருக்க வேண்டுமா?`. All remain for true audible replay; no canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 08:38'
          git push origin main
