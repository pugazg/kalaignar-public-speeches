name: Sync Audio 06 T2 precheck state 37

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-37.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=37
          pre['latest_completed_range']='23:25-23:44'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-37-23-25-23-44-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Thirty-six preparatory T2 records now exist:'
          new='Thirty-seven preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-36-22-52-23-25-precheck.md` — cross-party admirer list, Jeevanandam/Ma. Po. Si./Congress anchors and unresolved movement-preference contrast.\n'
          add='- `t2-batches/batch-37-23-25-23-44-precheck.md` — election campaigning, Anna/Rajendran/Karunanidhi victory anchors, movement candidates, travel and villuppattu wording.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 37 covers `23:25–23:44`. Machine evidence directly recovers `தேர்தல் நேரங்களில்`, `அண்ணா வெற்றி பெற வேண்டும்`, shorter `ராஜேந்திரன் வெற்றி`, `நான் வெற்றி பெற வேண்டும்`, `வில்லுப்பாட்டு`, and a generic `இடங்களில்லை`, but does not literally confirm the full `லட்சிய நடிகர் ராஜேந்திரன் வெற்றி பெற வேண்டும்`, `கழகத் தோழர்கள் வெற்றி பெற வேண்டும்`, `அலையாத`, `வில்லுப்பாட்டு நடைபெறாத இடங்களில்லை`, or `அதற்கு அடையாளம்` forms. Those titles, candidate wording and emphatic campaign constructions remain for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Thirty-six preparatory records are complete:'
          new='Thirty-seven preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='36. `t2-batches/batch-36-22-52-23-25-precheck.md`.\n'
          add='37. `t2-batches/batch-37-23-25-23-44-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe thirty-seventh precheck covers `23:25–23:44`. It maps the election-campaign passage and identifies machine-supported Anna, Rajendran, Karunanidhi, villuppattu and `இடங்களில்லை` anchors, while preserving the Rajendran title, other movement-candidate phrase, travel verb and full villuppattu construction for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 23:44'
          git push origin main
