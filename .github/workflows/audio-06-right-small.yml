name: Audio 06 right-channel navigation transcript

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-right-small.yml

permissions:
  contents: read

jobs:
  right-channel-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper
      - name: Download and extract right channel
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://tamildigitallibrary.in/kalaignar/audio/06.Kalavaivannar%20N.S.Krishnnan%20Ninavul%20Naal%20Vizha%20Vil%20Kaligar%20Speech.mp3' \
            -o source.mp3
          echo '6f0149229196b1d6df092d9fee006253591afec7ba9512bfbeb46dd0ab82c836  source.mp3' | sha256sum -c
          ffmpeg -hide_banner -loglevel error -y -i source.mp3 -af 'pan=mono|c0=c1' -ar 16000 -c:a pcm_s16le right.wav
      - name: Transcribe right channel
        run: |
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json
          out=Path('audio-06-right-small'); out.mkdir(exist_ok=True)
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segs,info=model.transcribe('right.wav',language='ta',task='transcribe',beam_size=5,temperature=0.0,condition_on_previous_text=True,vad_filter=True,word_timestamps=False)
          rows=[]; lines=[]
          for s in segs:
              text=s.text.strip()
              lines.append(f'[{s.start:08.2f}-{s.end:08.2f}] {text}')
              rows.append({'start':s.start,'end':s.end,'text':text,'avg_logprob':s.avg_logprob,'no_speech_prob':s.no_speech_prob})
          (out/'full-right.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'full-right.json').write_text(json.dumps({'language':info.language,'language_probability':info.language_probability,'segments':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print((out/'full-right.txt').read_text(encoding='utf-8'))
          PY
          python transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-06-right-small
          path: audio-06-right-small/
          retention-days: 5
