name: Kalaivanar audio audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kalaivanar-audio-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-gratitude-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Download source and extract 00:45-01:30 boundary window
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://tamildigitallibrary.in/kalaignar/audio/05.Kalaivanar%20N.S.Krishnan%20Ninnaivu%20Naal%20Vizha%20vil%20Kalaigar%20Speech.mp3' \
            --output source.mp3
          sha256sum source.mp3 | tee source-sha256.txt
          test "$(cut -d' ' -f1 source-sha256.txt)" = "7457004d3c3ee87722edfe6814e830d3521b834dcf29b4de45bb7174a2278148"
          ffmpeg -hide_banner -loglevel error -y -ss 45 -i source.mp3 -t 45 -ar 16000 -ac 1 -c:a pcm_s16le boundary-raw.wav
          ffmpeg -hide_banner -loglevel error -y -ss 45 -i source.mp3 -t 45 -ar 16000 -ac 1 \
            -af 'highpass=f=80,lowpass=f=7800,afftdn=nf=-25,dynaudnorm=f=150:g=15' \
            -c:a pcm_s16le boundary-enhanced.wav

      - name: Run large-v3-turbo boundary transcription
        run: |
          cat > transcribe.py <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          out_dir = Path("asr-output")
          out_dir.mkdir(exist_ok=True)
          model = WhisperModel("large-v3-turbo", device="cpu", compute_type="int8")

          for label, audio in (("boundary-raw", "boundary-raw.wav"), ("boundary-enhanced", "boundary-enhanced.wav")):
              segments, info = model.transcribe(
                  audio,
                  language="ta",
                  task="transcribe",
                  beam_size=5,
                  best_of=5,
                  temperature=0.0,
                  condition_on_previous_text=False,
                  word_timestamps=True,
                  vad_filter=False,
              )
              rows = []
              lines = []
              for segment in segments:
                  absolute_start = segment.start + 45.0
                  absolute_end = segment.end + 45.0
                  text = segment.text.strip()
                  lines.append(f"[{absolute_start:07.2f}–{absolute_end:07.2f}] {text}")
                  words = []
                  if segment.words:
                      for word in segment.words:
                          words.append({
                              "start": None if word.start is None else word.start + 45.0,
                              "end": None if word.end is None else word.end + 45.0,
                              "word": word.word,
                              "probability": word.probability,
                          })
                  rows.append({"start": absolute_start, "end": absolute_end, "text": text, "words": words})
              (out_dir / f"{label}.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
              (out_dir / f"{label}.json").write_text(json.dumps({"model":"large-v3-turbo","language":info.language,"segments":rows}, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python transcribe.py
          echo '=== RAW ==='
          cat asr-output/boundary-raw.txt
          echo '=== ENHANCED ==='
          cat asr-output/boundary-enhanced.txt

      - name: Record silence landmarks
        run: |
          ffmpeg -hide_banner -loglevel info -i boundary-raw.wav \
            -af silencedetect=noise=-38dB:d=0.20 -f null - 2> asr-output/silence-detect.log || true
          cp source-sha256.txt asr-output/

      - name: Upload boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: kalaivanar-audio-boundary-00-45-01-30
          path: asr-output/
          if-no-files-found: error
          retention-days: 7
