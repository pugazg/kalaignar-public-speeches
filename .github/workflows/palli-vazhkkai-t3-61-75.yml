name: Palli Vazhkkai T3 PDF 61-75

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/palli-vazhkkai-t3-61-75.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate PDF 61-75 into canonical Tamil
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('speeches/palli-vazhkkai')
          canonical_path = root / 'transcription-ta.md'
          canonical = canonical_path.read_text(encoding='utf-8')

          assert '### PDF page 60 — printed page 59' in canonical
          assert '### PDF page 61 — printed page 60' not in canonical

          page_re = re.compile(r'^### PDF page (\d+) — printed page (\d+)\n\n', re.M)
          pages = {}
          printed = {}
          for path in [root / 't1-batches/batch-11-pdf-61-70.md', root / 't1-batches/batch-12-pdf-71-81.md']:
              text = path.read_text(encoding='utf-8')
              ms = list(page_re.finditer(text))
              for i, m in enumerate(ms):
                  p = int(m.group(1)); pr = int(m.group(2))
                  if p > 75:
                      continue
                  end = ms[i+1].start() if i + 1 < len(ms) else len(text)
                  body = text[m.end():end].strip()
                  pages[p] = body
                  printed[p] = pr

          assert sorted(pages) == list(range(61, 76)), sorted(pages)
          assert all(printed[p] == p - 1 for p in pages)

          def repl(p, old, new, n=1):
              c = pages[p].count(old)
              assert c == n, f'PDF {p}: expected {n} of {old!r}, found {c}'
              pages[p] = pages[p].replace(old, new, n)

          # T2 Batch 12 — PDF 61-65
          repl(62, 'கல்வெறிபட்டுக்', 'கல்லெறிபட்டுக்')
          repl(62, 'மீனவி மக்களைத் திருந்து', 'மீனவ மக்களைத் துறந்து')
          repl(63, 'மனிதன் மனிதனுக வாழவேண்டும்.', 'மனிதன் மனிதனாக வாழவேண்டும்.')
          repl(63, 'மனிதன் தன்னையும் பிறரையும் மனிதனுக மதித்து', 'மனிதன் தன்னையும் பிறரையும் மனிதனாக மதித்து')
          repl(63, 'மிருகத் தன்மையின்றும்', 'மிருகத் தன்மையினின்றும்')
          repl(63, 'பகுத்தறிவு படைத்தவனுக', 'பகுத்தறிவு படைத்தவனாக')
          repl(64, 'மூன்கெட்டு', 'மூளை கெட்டு')
          repl(64, 'அறிவும் தன்மை', 'அறியும் தன்மை')
          repl(65, 'ரஷ்யர்கள் என்று தெரிவித்து கொள்வதும்', 'ரஷ்யர்கள் என்று தெரிவித்துக்கொள்வதும்')
          repl(65, 'தமிழ் மகன் தமிழ் வீரனைத் திகழ்வான்!', 'தமிழ் மகன் தமிழ் வீரனாகத் திகழ்வான்!')

          # T2 Batch 13 — PDF 66-70
          repl(66, 'மாட்டானு?', 'மாட்டானா?')
          repl(66, 'ஒன்றன்பின் ஒன்றுக', 'ஒன்றன்பின் ஒன்றாக')
          repl(66, 'எரிமலையின் அவல் மூச்சாக', 'எரிமலையின் அனல் மூச்சாக')
          repl(66, 'அணைக்க முயல்வதுபோல', 'அணைக்க முயல்வது போல')
          repl(66, 'ஏடெழுதிகள் நன்றுக நினைவில்', 'ஏடெழுதிகள் நன்றாக நினைவில்')
          repl(67, 'நன்றுக நினைவிருக்கட்டும்!', 'நன்றாக நினைவிருக்கட்டும்!')
          repl(67, 'வாழ்க்கைக் கல்வியை வளர்ப்படுத்திக் கொள்ளுங்கள்', 'வாழ்க்கைக் கல்வியை வளப்படுத்திக் கொள்ளுங்கள்')
          repl(68, 'புத்தக வித்தகர்', 'புத்தகவித்தகர்')
          repl(68, 'உண்டாக்கப்படும் உலகம்தான், ‘பள்ளி வாழ்க்கை’!', 'உண்டாக்கப்படும் உலகந்தான், ‘பள்ளி வாழ்க்கை’!')
          repl(69, 'தந்திரங்களைக் தவறாது கவனித்து வர வேண்டும்', 'தந்திரங்களைத் தவறாது கவனித்து வர வேண்டும்')
          repl(69, 'சிக்கிவிடக் கூடாது; நேரடித் தொடர்புகொண்டு', 'சிக்கிவிடக் கூடாது, நேரடித் தொடர்புகொண்டு')
          repl(69, 'இதனை மாணவர்கள், நன்றுக நினைவு கொள்ள வேண்டும்', 'இதனை மாணவர்கள், நன்றாக நினைவு கொள்ள வேண்டும்')
          repl(70, 'வறுமை ஆசிரியர்களின் தோழனுகவே என்றும் அமைந்திருக்கிறது!', 'வறுமை ஆசிரியர்களின் தோழனாகவே என்றும் அமைந்திருக்கிறது!')

          # T2 Batch 14 — PDF 71-75
          repl(71, 'தேர்வு அறிவிப்பதோடு', '‘தேர்வு’ அறிவிப்பதோடு')
          repl(71, 'மினுபாவங்கொண்ட', 'மனோபாவங்கொண்ட')
          repl(72, 'வேதனை தரும் சொற்றொடர்கள்', 'வேதனைதரும் சொற்றொடர்கள்')
          repl(72, 'என்ற கேள்விகள், எழுப்புங்கள்?', 'என்ற கேள்விகளை, எழுப்புங்கள்?')
          repl(73, 'படித்த பரம்பரையின் ராகவே', 'படித்த பரம்பரையினராகவே')
          repl(74, 'வாசனையையும் வழிகத்தையும்', 'வாசனையையும் வழிகாட்டியையும்')
          repl(74, 'கெட்டிக்காரனுக', 'கெட்டிக்காரனாக')
          repl(74, 'முதல் மார்க்கு பெறுபவனுக', 'முதல் மார்க்கு பெறுபவனாக')
          repl(74, 'தானுகவே அமைகிறது', 'தானாகவே அமைகிறது')
          repl(75, 'இதற்கேல் வாழும் பொருந்தும் முறையிலே', 'இதற்கேல் வாழ் பொருந்தும் முறையிலே')
          repl(75, 'வறி, அவன், அந்த ஏழை மாணவன்', 'வாழ, அவன், அந்த ஏழை மாணவன்')

          # No split-word reconstruction is required in PDF 61-75. T2 records
          # establish only ordinary phrase/sentence continuations across these page boundaries.

          segment = '\n'.join(pages[p] for p in range(61, 76))
          stale = [
              'கல்வெறிபட்டுக்', 'மீனவி மக்களைத் திருந்து',
              'மனிதன் மனிதனுக வாழவேண்டும்', 'பிறரையும் மனிதனுக மதித்து',
              'மிருகத் தன்மையின்றும்', 'படைத்தவனுக', 'மூன்கெட்டு', 'அறிவும் தன்மை',
              'தெரிவித்து கொள்வதும்', 'தமிழ் வீரனைத் திகழ்வான்',
              'மாட்டானு?', 'ஒன்றன்பின் ஒன்றுக', 'அவல் மூச்சாக', 'முயல்வதுபோல',
              'நன்றுக நினைவில்', 'நன்றுக நினைவிருக்கட்டும்', 'வளர்ப்படுத்திக்',
              'புத்தக வித்தகர்', 'உலகம்தான்', 'தந்திரங்களைக் தவறாது',
              'கூடாது; நேரடித் தொடர்புகொண்டு', 'நன்றுக நினைவு', 'தோழனுகவே',
              'தேர்வு அறிவிப்பதோடு', 'மினுபாவங்கொண்ட', 'வேதனை தரும் சொற்றொடர்கள்',
              'என்ற கேள்விகள், எழுப்புங்கள்?', 'பரம்பரையின் ராகவே', 'வழிகத்தையும்',
              'கெட்டிக்காரனுக', 'பெறுபவனுக', 'தானுகவே', 'வாழும் பொருந்தும்',
              'வறி, அவன், அந்த ஏழை மாணவன்'
          ]
          for s in stale:
              assert s not in segment, f'stale reading survives: {s}'

          keep = [
              'உண்டாக்கப்படும் உலகந்தான், ‘பள்ளி வாழ்க்கை’!',
              'திறமை எவருக்குத் தன்னுலே வருகிறது',
              'சோம்பேறி மாணக்கர்',
              'இதற்கேல் வாழ் பொருந்தும் முறையிலே',
              'வாழ, அவன், அந்த ஏழை மாணவன்'
          ]
          for s in keep:
              assert s in segment, f'source-supported reading missing: {s}'

          canonical = canonical.replace(
              '**Status:** `t3-in-progress` — canonical consolidation through **PDF 60 / printed page 59**',
              '**Status:** `t3-in-progress` — canonical consolidation through **PDF 75 / printed page 74**',
              1,
          )
          canonical = canonical.replace(
              '- This canonical file currently contains the T2-corrected consolidated segment **PDF 6-60 / printed 5-59**. PDF 61-81 remains in the source-controlled T1 staging batches until the next T3 merge step.',
              '- This canonical file currently contains the T2-corrected consolidated segment **PDF 6-75 / printed 5-74**. PDF 76-81 remains in the source-controlled T1 staging batch until the final T3 merge step.',
              1,
          )

          note_anchor = ('The second T3 consolidation pass incorporates PDF 46-60 / printed 45-59, including the verified '
                         '`சிந்தித்`/`தான்!` → `சிந்தித்தான்!`, `மற்`/`றொன்று` → `மற்றொன்று`, and '
                         '`வாழ்`/`வாகத்தானே` → `வாழ்வாகத்தானே` page-boundary joins. Source-supported unusual forms such as '
                         '`மனிதனி அறிவு கண்டு`, `தமிழனமாக`, and `மதனின் அறிவு` are retained.')
          assert note_anchor in canonical
          third_note = ('\n\nThe third T3 consolidation pass incorporates PDF 61-75 / printed 60-74. '
                        'All scan-proven T2 Batch 12-14 corrections are applied, including traditional-glyph mappings such as '
                        '`மனிதனாக`, `மாட்டானா`, `நன்றாக`, `தோழனாகவே`, `கெட்டிக்காரனாக`, `பெறுபவனாக`, and `தானாகவே`. '
                        'Source-supported forms including `உலகந்தான்`, `தன்னுலே`, and `இதற்கேல் வாழ் பொருந்தும் முறையிலே` are retained.')
          canonical = canonical.replace(note_anchor, note_anchor + third_note, 1)

          addition = ''
          for p in range(61, 76):
              addition += f'\n\n### PDF page {p} — printed page {p-1}\n\n{pages[p]}'
          canonical = canonical.rstrip() + addition + '\n'

          headings = [int(x) for x in re.findall(r'^### PDF page (\d+) — printed page \d+$', canonical, re.M)]
          assert headings == list(range(6, 76)), headings
          assert canonical.rstrip().endswith('அத்துடன்')

          canonical_path.write_text(canonical, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add speeches/palli-vazhkkai/transcription-ta.md
          git diff --cached --stat
          git commit -m 'Consolidate Palli Vazhkkai T3 through PDF 75'
          git push origin HEAD:main
