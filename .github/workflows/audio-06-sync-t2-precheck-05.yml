name: Sync Audio 06 T2 precheck state 05

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-05.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=5
          pre['latest_completed_range']='04:00-05:14'
          pre['records']=[
              't2-batches/batch-01-00-00-01-10-precheck.md',
              't2-batches/batch-02-01-10-02-34-precheck.md',
              't2-batches/batch-03-02-34-03-22-precheck.md',
              't2-batches/batch-04-03-22-04-00-precheck.md',
              't2-batches/batch-05-04-00-05-14-precheck.md'
          ]
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Four preparatory T2 records now exist:', 'Five preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-04-03-22-04-00-precheck.md` — opposition-period hotel-room setup and Kannadasan political-separation context.\n'
          add='- `t2-batches/batch-05-04-00-05-14-precheck.md` — crossed-telephone setup through the first unresolved exchange.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 5 strongly supports the crossed-telephone narrative but leaves several lexical choices for replay: `மேகலா பட நிறுவனத்திலே` versus a machine `நிர்வாகத்திலே` reading, current `இன்னொரு பையனுடைய குரல்` versus machine `இன்னொரு பழகிய குரல்`, the full telephone-interference sentence, the Mekala contact/manager wording, and the exact clause describing two calls becoming connected. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Four preparatory records are complete:', 'Five preparatory records are complete:', 1)
          needle='4. `t2-batches/batch-04-03-22-04-00-precheck.md`.\n'
          add='5. `t2-batches/batch-05-04-00-05-14-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe fifth precheck covers `04:00–05:14`. It confirms the crossed-telephone structure but leaves the Mekala organization wording, `பையனுடைய/பழகிய குரல்`, the interference sentence, contact/manager wording and exact crossed-line connection clause for true audible replay.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 05:14'
          git push origin main
