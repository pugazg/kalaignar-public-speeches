name: Sync Audio 06 T2 precheck state 12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-12.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=12
          pre['latest_completed_range']='09:25-09:50'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-12-09-25-09-50-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eleven preparatory T2 records now exist:', 'Twelve preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-11-08-38-09-25-precheck.md` — `இஞ்சிப்பத்தர்` gold/brass deception and Anna\'s interpretation of Kalaivanar\'s performance.\n'
          add='- `t2-batches/batch-12-09-25-09-50-precheck.md` — Anna\'s `வஞ்சிப்பத்தர் / இஞ்சிப்பத்தர்` conclusion and medicine-with-honey transition.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 12 strongly supports the two-part transition from Anna's `வஞ்சிப்பத்தர் / இஞ்சிப்பத்தர்` conclusion to Kalaivanar's ability to convey political, economic and social ideas like medicine mixed with honey. Exact replay must settle `ஆக/ஆகவே`, current `வஞ்சிப்பத்தரை` and `இஞ்சிப்பத்தரே மேல்` versus machine-segmented `வஞ்சிப் பட்டறையை / இஞ்சிப் பட்டறை மேல்`, `பற்றிப்/பற்றி`, and especially current `தேனிலே மருந்தைக் கலந்து` versus machine `தேனிடை மருந்தை கலந்து`, plus final case morphology. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Eleven preparatory records are complete:', 'Twelve preparatory records are complete:', 1)
          needle='11. `t2-batches/batch-11-08-38-09-25-precheck.md`.\n'
          add='12. `t2-batches/batch-12-09-25-09-50-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twelfth precheck covers `09:25–09:50`. It supports Anna's `வஞ்சிப்பத்தர் / இஞ்சிப்பத்தர்` conclusion and the medicine-with-honey transition, but leaves the exact character-name inflections, `ஆக/ஆகவே`, and especially `தேனிலே / தேனிடை` plus surrounding case morphology for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 09:50'
          git push origin main
