name: Sync Audio 06 T2 precheck state 13

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-13.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=13
          pre['latest_completed_range']='09:50-10:18'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-13-09-50-10-18-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twelve preparatory T2 records now exist:', 'Thirteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-12-09-25-09-50-precheck.md` — Anna\'s `வஞ்சிப்பத்தர் / இஞ்சிப்பத்தர்` conclusion and medicine-with-honey transition.\n'
          add='- `t2-batches/batch-13-09-50-10-18-precheck.md` — K. R. Ramasamy, `நடிகவேள்`, reform-theatre brothers and the Rajendran boundary.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 13 supports the opening artist-list structure and K. R. Ramasamy identification, then exposes heavy machine corruption around the `நடிகவேள்` proper name and the reform-theatre brothers' title/name sequence. Independent right-channel navigation also supports an institutional clause resembling `அவர்களுடைய நிறுவனத்திலே இருந்து` and the transition near `10:18` toward `போராடிய நம்முடைய லட்சிய நடிகர் ராஜேந்திரன்`. Exact names, initials, titles and syntax remain for true audible replay. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twelve preparatory records are complete:', 'Thirteen preparatory records are complete:', 1)
          needle='12. `t2-batches/batch-12-09-25-09-50-precheck.md`.\n'
          add='13. `t2-batches/batch-13-09-50-10-18-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe thirteenth precheck covers `09:50–10:18`. It supports K. R. Ramasamy and the broad early movement-artist list, but leaves the exact `நடிகவேள்` name, reform-theatre brothers' titles/names, institutional clause and the Rajendran transition for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 10:18'
          git push origin main
