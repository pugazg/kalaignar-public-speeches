name: Palli Vazhkkai Final T3 Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/palli-vazhkkai-t3-final-gate.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run whole-body T3 verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('speeches/palli-vazhkkai')
          path = root / 'transcription-ta.md'
          text = path.read_text(encoding='utf-8')
          assert '## Main body' in text
          header, body = text.split('## Main body', 1)

          page_re = re.compile(r'^### PDF page (\d+) — printed page (\d+)\n\n', re.M)
          ms = list(page_re.finditer(body))
          heads = [(int(m.group(1)), int(m.group(2))) for m in ms]
          assert len(heads) == 76, f'expected 76 headings, got {len(heads)}'
          assert heads == [(p, p-1) for p in range(6, 82)], f'heading sequence/mapping mismatch: {heads}'
          assert len(set(heads)) == 76

          pages = {}
          for i, m in enumerate(ms):
              p = int(m.group(1))
              end = ms[i+1].start() if i+1 < len(ms) else len(body)
              pages[p] = body[m.end():end].strip()
          assert sorted(pages) == list(range(6,82))
          assert all(pages[p] for p in pages)

          # Endpoint validation against the visually audited source record.
          assert pages[6].startswith('#### பள்ளி வாழ்க்கை\n\nபள்ளி வாழ்க்கை! மனித வாழ்க்கையிலே வளமான ஒரு பகுதி!')
          assert pages[81].endswith('தீரத் தமிழராக, தன்மானச் சிங்கங்களாக விளங்க அடிப்படை காணுங்கள், பள்ளி வாழ்க்கையில்! வணக்கம் !!')

          # T2 evidence inventory must remain complete.
          t2dir = root / 't2-batches'
          files = {p.name for p in t2dir.glob('*.md')}
          expected_names = {
              'batch-01-pdf-06-10.md','batch-02-pdf-11-15.md','batch-03-pdf-16-20.md','batch-04-pdf-21-25.md',
              'batch-05-pdf-26-30.md','batch-06-pdf-31-35.md','batch-07-pdf-36-40.md','batch-08-pdf-41-45.md',
              'batch-09-pdf-46-50.md','batch-10-pdf-51-55.md','batch-11-pdf-56-60.md','batch-12-pdf-61-65.md',
              'batch-13-pdf-66-70.md','batch-14-pdf-71-75.md','batch-15-pdf-76-80.md','batch-16-pdf-81.md',
              'legacy-glyph-recheck-pdf-06-35.md','legacy-glyph-recheck-pdf-36-40.md'
          }
          assert expected_names <= files, f'missing T2 evidence: {sorted(expected_names-files)}'

          # Superseded traditional-glyph/T1 readings. Match a complete stale form,
          # not a prefix of a legitimate Tamil word such as தமிழனுக்கு / மனிதனுக்கு.
          stale = [
              'கற்றோனுக','கல்லூரனுக','கதாசிரியனுக','கட்டுரையாசிரியனுக','உத்தமனுக',
              'மண்ணுவது','நன்றுக','வாசனே','நிணப்பார்','நிணக்க','நிணத்திடும்','திடசித்தமுடையவனுக',
              'தமிழனுக','கவலிப்பட','நானு?','தோழனுக','தோழனுகத்','உறுதுணைவனுக','எவலனுக','மனிதனுக',
              'படைத்தவனுக','மாட்டானு','ஒன்றுகவே','ஒன்றன்பின் ஒன்றுக','தோழனுகவே','கெட்டிக்காரனுக',
              'பெறுபவனுக','தானுகவே','அவனுகத்தான்','தேவனே நம்பு!','தமிழமெல்லாம்','தமிழனத்தை',
              'மழையவர்','மினுபாவங்கொண்ட','மினையாளைக்','கோட்டாடுகளைப்போற்றிப்','சிக்கச் சீழிய',
              'கல்வெறிபட்டுக்','மீனவி மக்களைத் திருந்து','மூன்கெட்டு','தமிழ் வீரனைத் திகழ்வான்',
              'அவல் மூச்சாக','வளர்ப்படுத்திக்','தந்திரங்களைக் தவறாது','வழிகத்தையும்','வறி, அவன்',
              'ஒவ்வொரு வனுக்கும்','எய்ப்பது','நாட்டெங்கும்'
          ]
          def stale_match(term, s):
              return re.search(re.escape(term) + r'(?![\u0B80-\u0BFF])', s) is not None
          survivors = []
          for term in stale:
              hit_pages = [p for p,s in pages.items() if stale_match(term, s)]
              if hit_pages:
                  survivors.append((term, hit_pages))
          assert not survivors, f'superseded readings survived: {survivors}'

          # Representative scan-proven corrections from every T2 phase must be present.
          required = [
              'ஆராய்ந்து தெளிந்து','தோலினாலும்','மனித வர்க்கத்தின்','மனித வர்க்கத்தை','ஒருப்படியாக','வயலில் உழுது',
              'வரைவிட','கஞ்சிக்காவது','எட்டுச்சுரையெனப்','தன்னம்பிக்கையும்','இடம் உடைத்து','உள்ளபடி',
              'இகத்தை வெறுத்து','தன்னைப்பற்றிக்','கவலைப்பட','தனது வில்லைபூட்டி,','குருதிவடிந்தோடும்',
              'தமிழினத்தைப்','பசுமரத்தாணிபோலப்','தாங்கள் தான்','ஏகலவனை மறுபடி','பக்திக்கு','சீறிச் சினந்து',
              'நானா?','தேடுகிறீர்;','சுயமரியாதையற்ற செயல்','தீனதயாளன்','ஆலகால','நீலகண்டனார்','திடீரென்று',
              'சிவத் தொண்டு','மனையாளைக்','முறைதானா?','தேவைதான்','கோட்பாடுகளைப்போற்றிப்','சிக்கச் செய்ய','தேவைதானா',
              'ஊட்டிடும்','மறையவர்','தோழனாகத்','அதன் அச்சிடும்','உறுதுணைவனாக','உயரே செல்லும்','ஏவலனாக',
              'மனிதனாக','ஆனாலும் நடக்கிறதே','இரண்ணியாட்சகன்','இரண்ணியாட்சகனைத்','பரந்தபூமியை','மும்மூர்த்திகளில்',
              'மோதவிடப்படுகிறது;','சந்திரன் பூமியைச் சுற்றும்போது','வேறு வேறான காரணங்கள்','ஒன்றாகவே',
              'உபயோகப் படுத்திக்கொண்டும்','அந்தக் கால','சிந்தனை முதிர்ச்சி யடைந்து','நாகரிக வாழ்வு, வாழ்வதைப்','தமிழறிந்த',
              'கல்லெறிபட்டுக்','மீனவ மக்களைத் துறந்து','மிருகத் தன்மையினின்றும்','படைத்தவனாக','மூளை கெட்டு','அறியும் தன்மை',
              'தெரிவித்துக்கொள்வதும்','தமிழ் வீரனாகத் திகழ்வான்','மாட்டானா?','ஒன்றன்பின் ஒன்றாக','அனல் மூச்சாக','முயல்வது போல',
              'நன்றாக','வளப்படுத்திக்','புத்தகவித்தகர்','உலகந்தான்','தந்திரங்களைத் தவறாது','கூடாது, நேரடித்','தோழனாகவே',
              '‘தேர்வு’','மனோபாவங்கொண்ட','வேதனைதரும்','கேள்விகளை, எழுப்புங்கள்?','பரம்பரையினராகவே','வழிகாட்டியையும்',
              'கெட்டிக்காரனாக','பெறுபவனாக','தானாகவே','வாழ, அவன்','அவனாகத்தான்','ஒவ்வொருவனுக்கும்','ஏய்ப்பது','நாடெங்கும்',
              'தேவனை நம்பு!','தமிழரெல்லாம்','தமிழினத்தை'
          ]
          missing = [s for s in required if s not in body]
          assert not missing, f'required verified forms missing: {missing}'

          # All non-obvious recorded split-word page joins.
          joins = [
              'உயிரினங்களைவிட','இவர்கட்கு','கஞ்சிக்காவது','எட்டுச்சுரையெனப்','உள்ளபடி',
              'தமிழினத்தைப்','பசுமரத்தாணிபோலப்','தேடுகிறீர்;','சுயமரியாதையற்ற செயல்','ஊட்டிடும்',
              'சிந்தித்தான்!','மற்றொன்று','வாழ்வாகத்தானே','துறைகளிலும்','தகுதியையும்','ஏற்பட்டது','விளங்குகின்றனர்'
          ]
          missing_joins = [s for s in joins if s not in body]
          assert not missing_joins, f'verified joins missing: {missing_joins}'

          # Source-supported unusual forms that must survive consolidation unchanged.
          oddities = [
              'கல்வி கற்கு மிடம்','நல்லதங்கள்','முன்னேற்றம் மடைகின்றன','அரிபந்தாமன்','காண்டவன்',
              'மாணுக்கர்களுக்கு','மனிதனி அறிவு கண்டு','தமிழனமாக','மதனின் அறிவு வளர்ச்சி பெற்று',
              'சுதுமதி படைத்தோரால்','இராஜ இராஜேந்திரனின்','உலகந்தான்','தன்னுலே',
              'சோம்பேறி மாணக்கர்','இதற்கேல் வாழ் பொருந்தும் முறையிலே','உலகியலேக் காண'
          ]
          missing_odd = [s for s in oddities if s not in body]
          assert not missing_odd, f'source-supported oddities lost: {missing_odd}'

          # Representative ordinary boundary continuations remain page-separated.
          ordinary = {
              (37,38): ('வலதுகைப்', 'பெருவிரல்'),
              (38,39): ('சாபந் தந்த', 'பிரகஸ்பதி பகவான்களும்'),
              (45,46): ('வருணபகவான் என்றும்', 'இடிக்குத் தலைவன் இந்திரன் என்றும்'),
              (49,50): ('காலம் அறிவிக்கும்', 'கடிகார வகைகள்'),
              (59,60): ('இராஜ இராஜேந்திரனின்', None),
              (70,71): ('பாடத்தைப் போதித்தோம்,', 'படிக்கிற பிள்ளைகள்'),
              (75,76): ('அத்துடன்', 'படிக்கிறான்.'),
              (80,81): ('என்றெல்லாம் நாட்டில் கூக்குரல்,', 'பழக்க வழக்கத்தின் பேரால்')
          }
          for (a,b),(left,right) in ordinary.items():
              assert left in pages[a], f'ordinary boundary {a}->{b}: left witness missing: {left}'
              if right:
                  assert pages[b].startswith(right) or right in pages[b][:200], f'ordinary boundary {a}->{b}: right witness missing: {right}'

          # No exact duplicate page bodies after consolidation.
          normalized = {p: re.sub(r'\s+',' ',pages[p]).strip() for p in pages}
          inv, dups = {}, []
          for p,v in normalized.items():
              if v in inv:
                  dups.append((inv[v],p))
              inv[v]=p
          assert not dups, f'exact duplicate page bodies found: {dups}'

          # Freeze canonical header only after every check above passes.
          old_status = '**Status:** `t3-in-progress` — canonical consolidation complete through **PDF 81 / printed page 80**; whole-body T3 gate pending'
          new_status = '**Status:** `verified-complete` — Tamil T3 whole-body gate passed and canonical layer frozen'
          assert old_status in text
          text = text.replace(old_status, new_status, 1)
          text = text.replace('- T3 consolidation/freeze: **in progress**.', '- T3 consolidation/freeze: **verified-complete — frozen**.', 1)
          text = text.replace(
              '- This canonical file now contains the T2-corrected consolidated text for **all PDF 6-81 / printed 5-80**. The whole-body stale-reading, page-continuity, heading-count and endpoint checks are still pending before freeze.',
              '- This canonical file contains the T2-corrected consolidated text for **all PDF 6-81 / printed 5-80** and has passed the whole-body stale-reading, page-continuity, heading-count, endpoint and source-oddity checks.', 1)
          text = text.replace('- Tamil is **not yet frozen / verified-complete**.', '- Tamil is **frozen / verified-complete**. Later Tamil changes require documented source evidence and dependent English re-verification.', 1)
          path.write_text(text, encoding='utf-8')

          report = '''# பள்ளி வாழ்க்கை — T3 final verification

**Result:** PASS  
**Scope:** canonical Tamil body PDF 6-81 / printed 5-80  
**Pages:** 76/76

## Checks passed

- Exactly 76 unique sequential page headings, PDF 6-81 mapped to printed 5-80.
- No empty or exact-duplicate page body detected.
- Canonical opening and verified final closing confirmed.
- Superseded traditional-glyph/T1 readings in the final stale list are absent as complete stale forms from the body.
- Representative scan-proven corrections from T2 Batches 1-16 are present.
- All recorded non-obvious split-word joins used by T3 are present.
- Representative ordinary page-boundary continuations remain page-separated and preserve their T2 witnesses.
- Representative source-supported unusual readings remain unchanged.
- All 16 T2 batch records and both legacy-glyph recheck records remain present.

## Freeze decision

The Tamil layer meets the repository guide's T3 conditions and is frozen as `verified-complete`. Any later Tamil change requires documented source evidence and dependent English re-verification.

English translation may now begin from `transcription-ta.md`.
'''
          (root / 't3-final-verification.md').write_text(report, encoding='utf-8')
          PY

      - name: Commit verified Tamil freeze
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add speeches/palli-vazhkkai/transcription-ta.md speeches/palli-vazhkkai/t3-final-verification.md
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze verified Palli Vazhkkai Tamil transcription'
          git push
