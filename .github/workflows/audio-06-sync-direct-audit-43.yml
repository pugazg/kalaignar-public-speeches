name: Sync Audio 06 direct audit 43

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-direct-audit-43.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize first direct-listening audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')
          record='t2-batches/batch-43-direct-listening-audit-00-00-01-10.md'

          # Canonical Tamil: replace only the wholly unresolved lead-in placeholder
          p=base/'transcription-ta.md'
          s=p.read_text(encoding='utf-8')
          old='`[Wording unresolved; direct transcription pending. The lead-in ends at approximately 00:14.]`'
          new='`[முதல் குறும் சொற்றொடர் தெளிவில்லை.] சென்னை கலைவாணர் அரங்கம் [ஒரு குறும் சொற்றொடர் தெளிவில்லை]. கலைவாணர் நகைச்சுவை பற்றி டாக்டர் கலைஞர் அவர்கள் இப்போது உரையாற்றுவார்.`'
          if old not in s:
              raise SystemExit('transcription lead-in placeholder missing')
          s=s.replace(old,new,1)
          s=s.replace('**Status:** **T1 first pass complete — provisional draft reaches the true decoded end at 00:26:22.080, with explicit unresolved ranges; direct auditory verification pending**',
                      '**Status:** **T2 strict direct-listening audit in progress — 2 segments checked / 1 passed; opening lead-in still partly unresolved**',1)
          p.write_text(s,encoding='utf-8')

          # Metadata
          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['time_map'][0]['status']='direct-listened; partial wording unresolved; not passed'
          d['time_map'][1]['status']='t2-direct-listening-verified'
          b=d.setdefault('boundary_precheck',{})
          b['main_speech_onset_directly_confirmed']=True
          b['main_speech_onset_confirmed_approx']='00:41.9'
          b['first_main_speech_word']='கலைவாணருடைய'
          b['opening_verified']=False
          a=d.setdefault('direct_listening_audit',{})
          a['status']='in-progress'
          a['segments_checked']=2
          a['segments_passed']=1
          a['latest_checked_range']='00:00-01:10'
          a['records']=[record]
          a['lead_in_passed']=False
          a['main_speech_opening_passed']=True
          a['recording_boundary_verified']=False
          a['recording_truncated']=None
          d['workflow']['strict_audio_audit']='in-progress'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # README
          p=base/'README.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('- main speech begins approximately `00:42`;',
                      '- main speech begins approximately `00:41.9`; this onset and the first main-speech word `கலைவாணருடைய` are direct-listening confirmed;',1)
          s=s.replace('- opening and ending are not yet strict-direct-listening verified;',
                      '- the first main-speech sentence is direct-listening verified, but the separate lead-in and complete opening gate remain unresolved; the ending is not yet verified;',1)
          s=s.replace('| Tamil T2 strict direct-listening audit | **Not started** |',
                      '| Tamil T2 strict direct-listening audit | **In progress — 2 segments checked / 1 passed** |',1)
          old='Begin **Tamil T2 strict direct-listening audit from `00:00`** — not from the tail and not with English.\n\nStart by directly transcribing/verifying the separate spoken lead-in and confirming the exact main-speech opening boundary. Continue segment by segment against the controlling MP3. Before Tamil can be frozen, T2 must also include dedicated final-60-second, final-30-second and final-major-pause-to-true-end replays.'
          new='Continue **Tamil T2 strict direct listening with `01:10–02:20`**. The `00:00–01:10` audit has checked two segments and passed the first main-speech segment; the partly unresolved announcer lead-in remains a mandatory opening-gate retry before T2 closure. Before Tamil can be frozen, T2 must also include dedicated final-60-second, final-30-second and final-major-pause-to-true-end replays.'
          if old not in s:
              raise SystemExit('README exact-next block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Audit: supersede capability gate and record the direct pass
          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('## T2 execution gate — current environment',
                      '## T2 execution gate — superseded by source reattachment',1)
          old='Textual/ASR preparation is complete through the true decoded end, but the current execution environment does not expose the controlling MP3 as genuine audible playback to the assistant. Available attachment/file interfaces expose machine-transcript or file-analysis evidence only. Under `AUDIO_SPEECH_PROCESSING_GUIDE.md`, those evidence classes must **not** be counted as direct listening.'
          new='This gate applied before the checksum-matching MP3 was reattached with genuine audible playback. It is superseded by Batch 43. The earlier attachment/file paths exposed only machine-transcript or file-analysis evidence, so the decision not to count any prior work as direct listening remains valid.'
          if old not in s:
              raise SystemExit('audit gate paragraph missing')
          s=s.replace(old,new,1)
          old2='Therefore no T2 segment has been claimed checked or passed in this environment. The direct-listening counters remain **0 checked / 0 passed**; opening and ending remain unverified; `recording_truncated` remains unresolved. A session/environment with actual audible replay must resume the strict T2 audit at `00:00`, beginning with the separate spoken lead-in and opening gate.'
          new2='After reattachment, genuine audible replay began at `00:00`. Batch 43 records **2 checked / 1 passed**: the separate lead-in was checked but remains partly unresolved, while the quiet interval, main-speech onset, first word and first main-speech sentence passed. The complete opening gate and ending remain unverified; `recording_truncated` remains unresolved.'
          if old2 not in s:
              raise SystemExit('audit gate state paragraph missing')
          s=s.replace(old2,new2,1)
          section='''## T2 direct-listening Batch 43 — `00:00–01:10`\n\nThe checksum-matching MP3 was audibly replayed in sequential crops, with both channels and slower playback used only as listening aids. The lead-in supports `சென்னை கலைவாணர் அரங்கம்`, `கலைவாணர் நகைச்சுவை பற்றி`, `டாக்டர் கலைஞர் அவர்கள்`, and `இப்போது உரையாற்றுவார்`, but its first short phrase and one hall-description phrase remain unresolved. That segment is checked but not passed.\n\nDirect replay confirms the quiet/ambience interval, main-speech onset at approximately `00:41.9`, first word `கலைவாணருடைய`, and the complete first sentence already present in `transcription-ta.md`. In particular, the source says `படையலை` and `மிகையாகாது`; the competing machine forms are rejected. Segment 1 is passed with no substantive correction.\n\nCumulative direct-listening state: **2 checked / 1 passed**. Record: `t2-batches/batch-43-direct-listening-audit-00-00-01-10.md`.\n\n'''
          marker='## Exact next activity\n'
          if section.strip() not in s:
              if marker not in s: raise SystemExit('audit exact-next marker missing')
              s=s.replace(marker,section+marker,1)
          oldnext='Begin **Tamil T2 strict direct-listening audit from `00:00`**.'
          newnext='Continue **Tamil T2 strict direct listening with `01:10–02:20`**, while retaining the partly unresolved lead-in as a mandatory opening-gate retry.'
          if oldnext not in s: raise SystemExit('audit next sentence missing')
          s=s.replace(oldnext,newnext,1)
          p.write_text(s,encoding='utf-8')

          # Handover: same durable transition
          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('## T2 execution capability note',
                      '## T2 execution capability note — superseded',1)
          old='All 42 textual/ASR prechecks are complete and the next source activity is strict direct listening from `00:00`. In the ChatGPT execution environment that prepared this handover, the attached MP3 is available only through machine-transcript/file-analysis paths rather than genuine audible playback to the assistant. Those paths are not T2 under the repository guide.'
          new='All 42 textual/ASR prechecks remain complete. The earlier execution gate was superseded when the checksum-matching MP3 was reattached with genuine audible playback. Batch 43 therefore began strict direct listening from `00:00`; the historical decision not to count earlier machine-transcript/file-analysis work as T2 remains valid.'
          if old not in s: raise SystemExit('handover gate paragraph missing')
          s=s.replace(old,new,1)
          old2='Do **not** infer any T2 progress from the completed prechecks. Direct-listening state remains **0 checked / 0 passed**. Opening, ending and `recording_truncated` remain unresolved. Resume from `00:00` only in an environment/session that can actually replay and hear the controlling MP3.'
          new2='Do **not** infer T2 progress from the prechecks themselves. Genuine direct-listening state is now **2 checked / 1 passed**. The first main-speech segment passed, while the announcer lead-in remains partly unresolved; the complete opening gate, ending and `recording_truncated` remain unresolved.'
          if old2 not in s: raise SystemExit('handover gate state missing')
          s=s.replace(old2,new2,1)
          section='''## Latest direct-listening result\n\nBatch 43 (`00:00–01:10`) is the first genuine T2 audit record. It confirms the quiet interval, main-speech onset at approximately `00:41.9`, first word `கலைவாணருடைய`, and the first complete main-speech sentence including `படையலை` and `மிகையாகாது`. The separate announcer lead-in was replayed but still contains two short unresolved phrases, so the opening gate is not complete. Cumulative state: **2 checked / 1 passed**.\n\nRecord: `t2-batches/batch-43-direct-listening-audit-00-00-01-10.md`.\n\n'''
          marker='## Exact next activity\n'
          if section.strip() not in s:
              if marker not in s: raise SystemExit('handover next marker missing')
              s=s.replace(marker,section+marker,1)
          oldnext='Begin **T2 strict direct-listening audit from `00:00`** using actual audible replay of the controlling MP3.'
          newnext='Continue **T2 strict direct listening with `01:10–02:20`** using the checksum-matching controlling MP3. Retain the partly unresolved `00:00–00:14` lead-in as a mandatory opening-gate retry before T2 closure.'
          if oldnext not in s: raise SystemExit('handover next sentence missing')
          s=s.replace(oldnext,newnext,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized direct-audit state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/transcription-ta.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/README.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Start Audio 06 T2 direct audit through 01:10'
          git push origin main
