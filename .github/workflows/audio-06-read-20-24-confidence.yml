name: Audio 06 read captured 20-24 confidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-read-20-24-confidence.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect-confidence:
    runs-on: ubuntu-latest
    steps:
      - name: Download captured artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/pugazg/kalaignar-public-speeches/actions/artifacts/9793079339/zip > artifact.zip
          unzip -q artifact.zip -d artifact
      - name: Print segments and low-confidence words
        run: |
          python - <<'PY'
          import json
          for fn in ['artifact/chunk-10-1200-1320.json','artifact/chunk-11-1320-1440.json']:
              print('\n===',fn,'===')
              data=json.load(open(fn,encoding='utf-8'))
              for s in data['segments']:
                  print(f"SEG {s['start']:.2f}-{s['end']:.2f} logp={s.get('avg_logprob'):.3f}: {s['text']}")
                  low=[w for w in s.get('words',[]) if w.get('probability',1)<0.45]
                  if low:
                      print('LOW:', ' | '.join(f"{w['word']}({w['probability']:.2f})" for w in low))
          PY
