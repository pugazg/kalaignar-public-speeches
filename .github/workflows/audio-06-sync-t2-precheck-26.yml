name: Sync Audio 06 T2 precheck state 26

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-26.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=26
          pre['latest_completed_range']='16:30-17:15'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-26-16-30-17-15-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-five preparatory T2 records now exist:'
          new='Twenty-six preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-25-16-00-16-30-precheck.md` — art serving political ideas versus art itself becoming politics, short `கலை தேவை` / `அரசியல் எண்ணங்களை` machine anchors, and the unresolved life-goal/Anna linkage.\n'
          add='- `t2-batches/batch-26-16-30-17-15-precheck.md` — beauty/taste rhetoric in words, speech and writing, expression-as-art examples, political-art linkage and the jewellery/women analogy.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 26 covers `16:30–17:15`. Machine evidence is uneven: it directly recovers `உள்ளத்திலே பதியும்`, uninflected `அரசியலுக்கு கலை தேவை`, `கலையே அரசியல் அல்ல`, `பெண்களுக்கு நகை தேவை`, and `நகையே பெண்கள் அல்ல`, but does not preserve the current full rhetorical wording around beauty in words/speech/writing, `சொல்லில் சுவை`, the writing/speech examples, or the inflected political-art sentence. The stronger analogy and weaker rhetorical build-up are therefore kept as separate replay-confidence levels. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-five preparatory records are complete:'
          new='Twenty-six preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='25. `t2-batches/batch-25-16-00-16-30-precheck.md`.\n'
          add='26. `t2-batches/batch-26-16-30-17-15-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-sixth precheck covers `16:30–17:15`. It maps the beauty/taste rhetoric and examples of art in expression, while machine evidence is strongest for the concluding political-art and jewellery/women analogy. Exact rhetorical wording, sandhi and audience reaction remain for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 17:15'
          git push origin main
