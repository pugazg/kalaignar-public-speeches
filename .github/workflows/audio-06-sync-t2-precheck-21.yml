name: Sync Audio 06 T2 precheck state 21

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-21.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=21
          pre['latest_completed_range']='14:00-14:15'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-21-14-00-14-15-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty preparatory T2 records now exist:', 'Twenty-one preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-20-13-15-14-00-precheck.md` — retired senior official / house sale, locality-agraharam objections, and the meeting sequence before the `14:00` remark.\n'
          add='- `t2-batches/batch-21-14-00-14-15-precheck.md` — `பேரைப் / தேரைப்` remark conflict, agraharam residents\' agreement and the twenty-years-earlier house-purchase conclusion.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 21 covers the short `14:00–14:15` conclusion of the house anecdote. Machine evidence supports `சாதுவாகத்தான் இருக்கிறார்`, a following clause resembling `அதற்குப் பிறகு அந்த அக்கிரகாரத்தில் உள்ள அத்தனை பேரும் ஒத்துக்கொண்டுதான்`, and the house-purchase conclusion. It conflicts directly with current T1 at `பேரைப் பார்த்து` versus machine `தேரைப் பார்த்து`, and leaves the post-quotation attribution, agreement-verb morphology, `வீட்டைக் / வீட்டை`, and exact `14:15` transition for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty preparatory records are complete:', 'Twenty-one preparatory records are complete:', 1)
          needle='20. `t2-batches/batch-20-13-15-14-00-precheck.md`.\n'
          add='21. `t2-batches/batch-21-14-00-14-15-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-first precheck covers `14:00–14:15`. It supports the mild-personality remark, a machine skeleton for the agraharam residents' eventual agreement and the twenty-years-earlier house-purchase conclusion, but leaves `பேரைப் / தேரைப்`, the post-quotation attribution, exact agreement morphology and house-purchase case marking for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 14:15'
          git push origin main
