name: Sync Audio 06 T2 prechecks 27-31

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-prechecks-27-31.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          records=[
            't2-batches/batch-27-17-15-17-47-precheck.md',
            't2-batches/batch-28-17-47-18-00-precheck.md',
            't2-batches/batch-29-18-00-19-00-precheck.md',
            't2-batches/batch-30-19-00-19-33-precheck.md',
            't2-batches/batch-31-19-33-20-00-precheck.md',
          ]

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=31
          pre['latest_completed_range']='19:33-20:00'
          arr=pre.setdefault('records',[])
          for rec in records:
              if rec not in arr:
                  arr.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-six preparatory T2 records now exist:'
          new='Thirty-one preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-26-16-30-17-15-precheck.md` — beauty/taste rhetoric in words, speech and writing, expression-as-art examples, political-art linkage and the jewellery/women analogy.\n'
          add=(
            '- `t2-batches/batch-27-17-15-17-47-precheck.md` — good/evil uses of art, growth of good-serving art, and Kalaivanar\'s unresolved artistic epithet/aim.\n'
            '- `t2-batches/batch-28-17-47-18-00-precheck.md` — spoken Kural opening, `எச்சத்தால் காணப்படும்`, and the `ஒருவர் நல்லவரா / நல்லவர் அல்லாதவரா` contrast.\n'
            '- `t2-batches/batch-29-18-00-19-00-precheck.md` — negative-evidence record for the machine-collapse interval in the Kural explanation.\n'
            '- `t2-batches/batch-30-19-00-19-33-precheck.md` — Kalaivanar legacy list, caste-abolition/art-service anchors, compassion wording and the `எச்சம் / பிள்ளைகள்` return.\n'
            '- `t2-batches/batch-31-19-33-20-00-precheck.md` — negative-evidence record for the malformed comparison/wordplay before the `20:00` `எச்சம்` clarification.\n'
          )
          if records[-1] not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatches 27–31 extend textual preparation from `17:15` through `20:00`. Batch 27 supports the good/evil-art contrast and `வளர்க்கப்பட வேண்டும்` direction but leaves Kalaivanar's epithet unresolved. Batch 28 preserves only machine-supported spoken Kural anchors and does not normalize from printed text. Batch 29 intentionally leaves `18:00–19:00` withheld after repeated-token collapse. Batch 30 recovers `ஜாதி ஒழிய வேண்டும்`, `ஆற்றிய கலைப்பணி`, `நெஞ்சிரக்கம்`, and `பிள்ளைகளால் காணப்படும்` anchors while leaving the full legacy/time-span syntax unresolved. Batch 31 remains negative evidence because the comparison before `20:00` is malformed in machine output; only broader `வள்ளுவர்`, `பிள்ளைகளால்`, and earlier `எச்சத்தால் காணப்படும்` anchors are usable. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-six preparatory records are complete:'
          new='Thirty-one preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='26. `t2-batches/batch-26-16-30-17-15-precheck.md`.\n'
          add=(
            '27. `t2-batches/batch-27-17-15-17-47-precheck.md`.\n'
            '28. `t2-batches/batch-28-17-47-18-00-precheck.md`.\n'
            '29. `t2-batches/batch-29-18-00-19-00-precheck.md`.\n'
            '30. `t2-batches/batch-30-19-00-19-33-precheck.md`.\n'
            '31. `t2-batches/batch-31-19-33-20-00-precheck.md`.\n'
          )
          if '31. `t2-batches/batch-31-19-33-20-00-precheck.md`.' not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-seventh through thirty-first prechecks cover `17:15–20:00`. They preserve the good/evil-art argument, isolate the spoken Kural opening, explicitly keep the `18:00–19:00` machine-collapse interval withheld, map the later Kalaivanar legacy anchors, and keep the malformed `19:33–20:00` comparison withheld. Printed Kural wording and historical movement terminology were not used to fill uncertain audio. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 20:00'
          git push origin main
