name: One-time Palli Vazhkkai T3 consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/palli-vazhkkai-t3.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate and validate verified Tamil
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('speeches/palli-vazhkkai')
          inputs = [
              root / 'transcription-ta.md',
              root / 't1-batches/batch-09-pdf-46-50.md',
              root / 't1-batches/batch-10-pdf-51-60.md',
              root / 't1-batches/batch-11-pdf-61-70.md',
              root / 't1-batches/batch-12-pdf-71-81.md',
          ]

          page_re = re.compile(r'^### PDF page (\d+) — printed page (\d+)\n\n', re.M)
          pages = {}
          printed = {}
          for path in inputs:
              text = path.read_text(encoding='utf-8')
              ms = list(page_re.finditer(text))
              assert ms, f'No page sections in {path}'
              for i, m in enumerate(ms):
                  p = int(m.group(1)); pr = int(m.group(2))
                  end = ms[i+1].start() if i + 1 < len(ms) else len(text)
                  body = text[m.end():end].strip()
                  assert p not in pages, f'duplicate PDF page {p}'
                  pages[p] = body
                  printed[p] = pr

          assert sorted(pages) == list(range(6, 82)), (min(pages), max(pages), len(pages))
          for p in range(6, 82):
              assert printed[p] == p - 1, (p, printed[p])

          applied = []
          def repl(p, old, new, expected=1):
              count = pages[p].count(old)
              assert count == expected, f'PDF {p}: expected {expected} occurrence(s) of {old!r}, found {count}'
              pages[p] = pages[p].replace(old, new)
              applied.append((p, old, new, expected))

          # T2 Batches 1-7 + corrected legacy-glyph interpretation.
          repl(7, 'ஆராய்ந்து தெரிந்து', 'ஆராய்ந்து தெளிந்து')
          repl(11, 'தோவினாலும்', 'தோலினாலும்')
          repl(12, 'மனித வாழ்க்கத்தின்', 'மனித வர்க்கத்தின்')
          repl(12, 'மனித வாழ்க்கத்தை', 'மனித வர்க்கத்தை')
          repl(12, 'நன்றுக', 'நன்றாக')
          repl(13, 'ஒருபடியாக', 'ஒருப்படியாக')
          repl(13, 'வயல் உழுது', 'வயலில் உழுது')
          repl(17, 'வரவிட', 'வரைவிட')
          repl(21, 'திடசித்தமுடையவனுக', 'திடசித்தமுடையவனாக')
          repl(22, 'இடம் கிடைத்து', 'இடம் உடைத்து')
          repl(26, 'தமிழனுக', 'தமிழனாக')
          repl(27, 'தமிழனுக', 'தமிழனாக', 2)
          repl(29, 'இத்தை வெறுத்து', 'இகத்தை வெறுத்து')
          repl(29, 'தன்னேப்பற்றிக்', 'தன்னைப்பற்றிக்')
          repl(29, 'கவலிப்பட', 'கவலைப்பட')
          repl(32, 'தேவைத்தானு', 'தேவைத்தானா')
          repl(33, 'தேவைத்தானு', 'தேவைத்தானா')
          repl(34, 'தனது வில்லெடுத்து,', 'தனது வில்லைபூட்டி,')
          repl(35, 'குறித்துவிட்டோடும்', 'குருதிவடிந்தோடும்')
          repl(36, 'தாங்கள்தான்.', 'தாங்கள் தான்.')
          repl(37, 'ஏகலவனின் மறுபடி துரோணர் பார்த்து', 'ஏகலவனை மறுபடி துரோணர் பார்த்து')
          repl(38, 'பகுதிக்கு', 'பக்திக்கு')
          repl(40, 'பதை பதைத்து சிரச் சினந்து', 'பதை பதைத்து சீறிச் சினந்து')

          # T2 Batch 8.
          repl(42, 'தினதயாளன்', 'தீனதயாளன்')
          repl(42, 'ஆல கால', 'ஆலகால')
          repl(42, 'நீலகண்டனூர்', 'நீலகண்டனார்')
          repl(42, 'திடமென்று', 'திடீரென்று')
          repl(43, 'சிவத்தொண்டு', 'சிவத் தொண்டு')
          repl(43, 'மினையாளைக்', 'மனையாளைக்')
          repl(43, 'முறைதானு?', 'முறைதானா?')
          repl(44, 'தேவைத்தான்', 'தேவைதான்')
          repl(44, 'கோட்டாடுகளைப்போற்றிப்', 'கோட்பாடுகளைப்போற்றிப்')
          repl(44, 'சிக்கச் சீழிய', 'சிக்கச் செய்ய')
          repl(45, 'தேவைத்தானு, இன்னும்?', 'தேவைதானா, இன்னும்?')

          # T2 Batch 9.
          repl(48, 'மழையவர்', 'மறையவர்')
          repl(49, 'தோழனுகத்', 'தோழனாகத்')
          repl(49, 'அதனின் அச்சிடும்', 'அதன் அச்சிடும்')
          repl(50, 'உறுதுணைவனுக', 'உறுதுணைவனாக')
          repl(50, 'உயிரே செல்லும்', 'உயரே செல்லும்')
          repl(50, 'எவலனுக', 'ஏவலனாக')

          # T2 Batch 10.
          repl(51, 'மனிதனுக', 'மனிதனாக')
          repl(52, 'ஆளும் நடக்கிறதே', 'ஆனாலும் நடக்கிறதே')
          repl(53, 'இரண்யாட்சன்', 'இரண்ணியாட்சகன்')
          repl(53, 'இரண்யாட்சனைத்', 'இரண்ணியாட்சகனைத்')
          repl(54, 'பார்ந்த பூமியை', 'பரந்தபூமியை')
          repl(54, 'மூம்மூர்த்திகளில்', 'மும்மூர்த்திகளில்')
          repl(55, 'மோதவிடப்படுகிறது, நாட்டில்', 'மோதவிடப்படுகிறது; நாட்டில்')
          old_eclipse = 'படிக்கிறோம், விஞ்ஞான வகுப்பில், பூமி, தன்னைத் தானே சுற்றிக்கொண்டே, சூரியனைச் சுற்றிவரும் பாதையில் ஏற்படும் மாறுதல்போன்று ஏற்படும் மாறுதல்பொறுத்தும் இந்தக் கிரகணங்கள் ஏற்படுகின்றன, என்று.'
          new_eclipse = 'படிக்கிறோம், விஞ்ஞான வகுப்பில், பூமி, தன்னைத் தானே சுற்றிக்கொண்டே, சூரியனைச் சுற்றிவரும் பாதையில் ஏற்படும் மாறுதலைப் பொருத்தும், சந்திரன் பூமியைச் சுற்றும்போது ஏற்படும் மாறுதலைப் பொருத்தும் இந்தக் கிரகணங்கள் ஏற்படுகின்றன, என்று.'
          repl(55, old_eclipse, new_eclipse)
          repl(55, 'இரு, வேறு வேறு காரணங்கள்', 'இரு, வேறு வேறான காரணங்கள்')

          # T2 Batch 11.
          repl(56, 'ஒன்றுகவே', 'ஒன்றாகவே')
          repl(56, 'உபயோகப்படுத்திக்கொண்டும்', 'உபயோகப் படுத்திக்கொண்டும்')
          repl(56, 'அங்கக் கால', 'அந்தக் கால')
          repl(57, 'சிந்தனை முதிர்ச்சி படைந்து', 'சிந்தனை முதிர்ச்சி யடைந்து')
          repl(57, 'நாகரிக வாழ்வு வாழ்வதைப்', 'நாகரிக வாழ்வு, வாழ்வதைப்')
          repl(60, 'தமிழனுக', 'தமிழனாக')
          repl(60, 'தமிழ் அறிந்த தமிழனமாக', 'தமிழறிந்த தமிழனமாக')

          # T2 Batch 12.
          repl(62, 'கல்வெறிபட்டுக்', 'கல்லெறிபட்டுக்')
          repl(62, 'மீனவி மக்களைத் திருந்து', 'மீனவ மக்களைத் துறந்து')
          repl(63, 'மனிதனுக', 'மனிதனாக', 2)
          repl(63, 'மிருகத் தன்மையின்றும்', 'மிருகத் தன்மையினின்றும்')
          repl(63, 'படைத்தவனுக', 'படைத்தவனாக')
          repl(64, 'மூன்கெட்டு', 'மூளை கெட்டு')
          repl(64, 'அறிவும் தன்மை', 'அறியும் தன்மை')
          repl(65, 'தெரிவித்து கொள்வதும்', 'தெரிவித்துக்கொள்வதும்')
          repl(65, 'தமிழ் வீரனைத் திகழ்வான்', 'தமிழ் வீரனாகத் திகழ்வான்')

          # T2 Batch 13.
          repl(66, 'மாட்டானு?', 'மாட்டானா?')
          repl(66, 'ஒன்றன்பின் ஒன்றுக', 'ஒன்றன்பின் ஒன்றாக')
          repl(66, 'அவல் மூச்சாக', 'அனல் மூச்சாக')
          repl(66, 'முயல்வதுபோல', 'முயல்வது போல')
          repl(66, 'நன்றுக நினைவில்', 'நன்றாக நினைவில்')
          repl(67, 'நன்றுக நினைவிருக்கட்டும்', 'நன்றாக நினைவிருக்கட்டும்')
          repl(67, 'வளர்ப்படுத்திக்', 'வளப்படுத்திக்')
          repl(68, 'புத்தக வித்தகர்', 'புத்தகவித்தகர்')
          repl(68, 'உலகம்தான்', 'உலகந்தான்')
          repl(69, 'தந்திரங்களைக் தவறாது', 'தந்திரங்களைத் தவறாது')
          repl(69, 'கூடாது; நேரடித்', 'கூடாது, நேரடித்')
          repl(69, 'நன்றுக நினைவு', 'நன்றாக நினைவு')
          repl(70, 'தோழனுகவே', 'தோழனாகவே')

          # T2 Batch 14.
          repl(71, 'தேர்வு அறிவிப்பதோடு', '‘தேர்வு’ அறிவிப்பதோடு')
          repl(71, 'மினுபாவங்கொண்ட', 'மனோபாவங்கொண்ட')
          repl(72, 'வேதனை தரும் சொற்றொடர்கள்', 'வேதனைதரும் சொற்றொடர்கள்')
          repl(72, 'என்ற கேள்விகள், எழுப்புங்கள்?', 'என்ற கேள்விகளை, எழுப்புங்கள்?')
          repl(73, 'படித்த பரம்பரையின் ராகவே', 'படித்த பரம்பரையினராகவே')
          repl(74, 'வாசனையையும் வழிகத்தையும்', 'வாசனையையும் வழிகாட்டியையும்')
          repl(74, 'கெட்டிக்காரனுக', 'கெட்டிக்காரனாக')
          repl(74, 'முதல் மார்க்கு பெறுபவனுக', 'முதல் மார்க்கு பெறுபவனாக')
          repl(74, 'தானுகவே', 'தானாகவே')
          repl(75, 'இதற்கேல் வாழும் பொருந்தும் முறையிலே', 'இதற்கேல் வாழ் பொருந்தும் முறையிலே')
          repl(75, 'வறி, அவன்', 'வாழ, அவன்')

          # T2 Batch 15.
          repl(76, 'அவனுகத்தான்', 'அவனாகத்தான்')
          repl(77, 'ஒவ்வொரு வனுக்கும்', 'ஒவ்வொருவனுக்கும்')
          repl(77, 'எய்ப்பது', 'ஏய்ப்பது')
          repl(78, 'நாட்டெங்கும்', 'நாடெங்கும்')
          repl(80, 'தேவனே நம்பு!', 'தேவனை நம்பு!')

          # T2 Batch 16.
          repl(81, 'தமிழமெல்லாம்', 'தமிழரெல்லாம்')
          repl(81, 'தமிழனத்தை', 'தமிழினத்தை')

          # Cross-page split words. Existing T1 sometimes already consolidated these.
          def join_split(p1, p2, left, right, joined):
              a = pages[p1].rstrip()
              b = pages[p2].lstrip()
              if joined in a and not b.startswith(right):
                  return
              assert a.endswith(left), f'PDF {p1}: expected end {left!r}, got {a[-80:]!r}'
              assert b.startswith(right), f'PDF {p2}: expected start {right!r}, got {b[:80]!r}'
              pages[p1] = a[:-len(left)] + joined
              pages[p2] = b[len(right):].lstrip()

          join_split(9, 10, 'உயி', 'ரினங்களைவிட', 'உயிரினங்களைவிட')
          join_split(13, 14, 'இவர்', 'கட்கு', 'இவர்கட்கு')
          join_split(18, 19, 'கஞ்சிக்', 'காவது,', 'கஞ்சிக்காவது,')
          join_split(19, 20, 'எட்டுச்', 'சுரையெனப்', 'எட்டுச்சுரையெனப்')
          join_split(23, 24, 'உள்ள', 'படி', 'உள்ளபடி')
          join_split(31, 32, 'தமிழினத்', 'தைப்', 'தமிழினத்தைப்')
          join_split(32, 33, 'பசுமரத்', 'தாணிபோலப்', 'பசுமரத்தாணிபோலப்')
          join_split(40, 41, 'தேடு', 'கிறீர்;', 'தேடுகிறீர்;')
          join_split(41, 42, 'சுயமரியாதை', 'யற்ற', 'சுயமரியாதையற்ற')
          join_split(44, 45, 'ஊட்', 'டிடும்', 'ஊட்டிடும்')
          join_split(50, 51, 'சிந்தித்', 'தான்!', 'சிந்தித்தான்!')
          join_split(55, 56, 'மற்', 'றொன்று,', 'மற்றொன்று,')
          join_split(56, 57, 'வாழ்', 'வாகத்தானே,', 'வாழ்வாகத்தானே,')
          join_split(76, 77, 'வாழ்வின் எல்லாத் துறை', 'களிலும்,', 'வாழ்வின் எல்லாத் துறைகளிலும்,')
          join_split(77, 78, 'தகுதியை', 'யும்,', 'தகுதியையும்,')
          join_split(78, 79, 'உணவுப் பஞ்சம் ஏற்பட்', 'டது,', 'உணவுப் பஞ்சம் ஏற்பட்டது,')
          join_split(79, 80, 'வாழமுடியாதவர்களாகவே விளங்குகின்ற', 'னர்.', 'வாழமுடியாதவர்களாகவே விளங்குகின்றனர்.')

          # Stale-reading gate: no superseded reading may survive in the body.
          body_all = '\n\n'.join(pages[p] for p in range(6, 82))
          stale = [
              'ஆராய்ந்து தெரிந்து', 'தோவினாலும்', 'மனித வாழ்க்கத்தின்', 'மனித வாழ்க்கத்தை',
              'ஒருபடியாக', 'வயல் உழுது', 'வரவிட', 'திடசித்தமுடையவனுக', 'இடம் கிடைத்து',
