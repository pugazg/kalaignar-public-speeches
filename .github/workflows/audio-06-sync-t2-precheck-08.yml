name: Sync Audio 06 T2 precheck state 08

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-08.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=8
          pre['latest_completed_range']='06:43-07:12'
          pre['records']=[
              't2-batches/batch-01-00-00-01-10-precheck.md',
              't2-batches/batch-02-01-10-02-34-precheck.md',
              't2-batches/batch-03-02-34-03-22-precheck.md',
              't2-batches/batch-04-03-22-04-00-precheck.md',
              't2-batches/batch-05-04-00-05-14-precheck.md',
              't2-batches/batch-06-05-14-06-00-precheck.md',
              't2-batches/batch-07-06-00-06-43-precheck.md',
              't2-batches/batch-08-06-43-07-12-precheck.md'
          ]
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Seven preparatory T2 records now exist:', 'Eight preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-07-06-00-06-43-precheck.md` — Tamil/art transforming hostility, Anna\'s use of art, and the Kalaivanar reference before S. S. Rajendran.\n'
          add='- `t2-batches/batch-08-06-43-07-12-precheck.md` — Rajendran reference and Kalaivanar\'s early progressive / Self-Respect ideas.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 8 strongly supports the Rajendran–Anna–Kalaivanar comparison and the sequence of revolutionary, Self-Respect and Tamil-society ideas. Exact replay must settle current `லட்சிய நடிகர் எஸ். எஸ். ராஜேந்திரன்` versus machine `தேசிய நடிகர் ராஜேந்திரன்`, whether `அல்லது` occurs between film and theatre, `எடுத்தாளுவதற்கு/எடுத்து ஆள்வதற்கு`, full `என். எஸ். கிருஷ்ணன்` versus `என். எஸ். கே.`, the short indistinct clause before the final verb, and `எடுத்துச் சொன்னார்/எடுத்துச் சொன்னார்கள்`. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Seven preparatory records are complete:', 'Eight preparatory records are complete:', 1)
          needle='7. `t2-batches/batch-07-06-00-06-43-precheck.md`.\n'
          add='8. `t2-batches/batch-08-06-43-07-12-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe eighth precheck covers `06:43–07:12`. It supports the broad Rajendran–Anna–Kalaivanar argument but leaves the Rajendran title/name form, film/theatre conjunction, `எடுத்தாளுவதற்கு`, Kalaivanar name form, a short indistinct clause and the final honorific verb for true audible replay.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 07:12'
          git push origin main
