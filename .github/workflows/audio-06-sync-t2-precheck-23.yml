name: Sync Audio 06 T2 precheck state 23

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-23.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=23
          pre['latest_completed_range']='14:59-15:35'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-23-14-59-15-35-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty-two preparatory T2 records now exist:', 'Twenty-three preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-22-14-15-14-59-precheck.md` — rationale for the house anecdote, changed ideological positions versus the continuing principle, gratitude to earlier workers and the Sivaji transition.\n'
          add='- `t2-batches/batch-23-14-59-15-35-precheck.md` — Sivaji stage-work recollection, humorous reversal of who acted with whom, and the unpaid-performance statement.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 23 covers `14:59–15:35`. Machine evidence strongly supports the Sivaji stage-recollection skeleton, the reversal from `என்னோடு சேர்ந்து சிவாஜி நடித்திருக்கிறார்` to `சிவாஜியோடு சேர்ந்து நான் நடித்தேன்`, the present-day `சூழ்நிலைக்குப் பொருத்தமாக இருக்கும்` idea, and the `பணம் வாங்காமல் வந்து நடிக்கின்ற` statement. It leaves the current `நகைச்சுவையாக` versus machine-corrupted `ரேடிக்கியாக`, `கருணாநிதி` versus machine `கலைஞர் அவர்கள்`, exact play-syntax and `விளங்கினார் / விளங்கினார்கள்` honorific morphology for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty-two preparatory records are complete:', 'Twenty-three preparatory records are complete:', 1)
          needle='22. `t2-batches/batch-22-14-15-14-59-precheck.md`.\n'
          add='23. `t2-batches/batch-23-14-59-15-35-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-third precheck covers `14:59–15:35`. It supports the Sivaji stage-work recollection, the humorous role-status reversal and Sivaji acting in the early plays without payment, but leaves the comic adjective, `கருணாநிதி / கலைஞர் அவர்கள்` subject form, exact syntax and honorific morphology for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 15:35'
          git push origin main
