name: Sync Audio 06 T2 precheck state 15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-15.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=15
          pre['latest_completed_range']='10:48-11:20'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-15-10-48-11-20-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Fourteen preparatory T2 records now exist:', 'Fifteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-14-10-18-10-48-precheck.md` — Rajendran/Narayanasamy boundary, Sivaji `சிம்மக்குரல்`, and the Periyar/Anna stage-screen statement.\n'
          add='- `t2-batches/batch-15-10-48-11-20-precheck.md` — Anna-call rhetoric, immediate artist response, and the professional-career fear contrast.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 15 gives a clearer machine-supported skeleton for the previously withheld `10:48–11:20` rhetoric: Anna calls, the artists go immediately, do not first ask `என்ன நாடகம், என்ன வேடம்`, are willing to speak what is asked, hold strong regard for Anna, and are contrasted with people who would flee from fear that acting or public association might damage their profession. Exact joins around `ஓடோடி`, the willingness-to-speak clause, the second Anna-reference, and the professional-career sentence remain for true audible replay. The canonical placeholder was intentionally retained; no Tamil was reconstructed from ASR.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Fourteen preparatory records are complete:', 'Fifteen preparatory records are complete:', 1)
          needle='14. `t2-batches/batch-14-10-18-10-48-precheck.md`.\n'
          add='15. `t2-batches/batch-15-10-48-11-20-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe fifteenth precheck covers `10:48–11:20`. It maps the withheld Anna-call rhetoric more clearly—immediate response, `என்ன நாடகம் / என்ன வேடம்`, willingness to speak, regard for Anna, and the contrast with career fear—but leaves the exact joins and final professional-risk wording for true audible replay. The canonical placeholder remains unchanged.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 11:20'
          git push origin main
