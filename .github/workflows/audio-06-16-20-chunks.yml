name: Audio 06 minutes 16-20 chunk navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-16-20-chunks.yml

permissions:
  contents: read

jobs:
  chunks-16-20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper
      - name: Download and verify
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://tamildigitallibrary.in/kalaignar/audio/06.Kalavaivannar%20N.S.Krishnnan%20Ninavul%20Naal%20Vizha%20Vil%20Kaligar%20Speech.mp3' \
            -o source.mp3
          echo '6f0149229196b1d6df092d9fee006253591afec7ba9512bfbeb46dd0ab82c836  source.mp3' | sha256sum -c
          ffmpeg -hide_banner -loglevel error -y -ss 960 -i source.mp3 -t 240 \
            -af 'pan=mono|c0=c1' -ar 16000 -c:a pcm_s16le range.wav
      - name: Transcribe independent 30-second chunks
        run: |
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import subprocess, pathlib
          out=pathlib.Path('chunks-16-20'); out.mkdir(exist_ok=True)
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8')
          for i,start in enumerate(range(0,240,30)):
              wav=out/f'chunk-{i}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i','range.wav','-t','30','-c:a','pcm_s16le',str(wav)],check=True)
              segs,info=model.transcribe(str(wav),language='ta',task='transcribe',beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=False,word_timestamps=False,vad_filter=False)
              print(f'=== CHUNK {960+start:04d}-{960+start+30:04d} ===')
              lines=[]
              for s in segs:
                  text=s.text.strip()
                  print(f'[{960+start+s.start:08.2f}-{960+start+s.end:08.2f}] {text}')
                  lines.append(f'[{960+start+s.start:08.2f}-{960+start+s.end:08.2f}] {text}')
              (out/f'chunk-{i}.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-06-16-20-chunks
          path: chunks-16-20/*.txt
          retention-days: 5
