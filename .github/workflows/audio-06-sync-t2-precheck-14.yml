name: Sync Audio 06 T2 precheck state 14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-14.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=14
          pre['latest_completed_range']='10:18-10:48'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-14-10-18-10-48-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Thirteen preparatory T2 records now exist:', 'Fourteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-13-09-50-10-18-precheck.md` — K. R. Ramasamy, `நடிகவேள்`, reform-theatre brothers and the Rajendran boundary.\n'
          add='- `t2-batches/batch-14-10-18-10-48-precheck.md` — Rajendran/Narayanasamy boundary, Sivaji `சிம்மக்குரல்`, and the Periyar/Anna stage-screen statement.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 14 strongly supports `நடிகமணி டி. வி. நாராயணசாமி`, `இந்த நாவினால்`, the idea that revolutionary views gain force when voiced, `சிம்மக்குரல்`, and `என்னுடைய நண்பர் சிவாஜி கணேசன்`. Machine evidence also proposes a boundary join from `லட்சிய நடிகர் ராஜேந்திரன்` into Narayanasamy. Exact replay must settle whether `எஸ். எஸ்.` and `ஆகியவர்கள்` are audible, `பேசினால்/பேசினால்தான்`, `முதல் முதலாகச்/முதன் முதலாக`, and the badly corrupted final statement about carrying Periyar and Anna's ideas onto stage and screen. No canonical change was made.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Thirteen preparatory records are complete:', 'Fourteen preparatory records are complete:', 1)
          needle='13. `t2-batches/batch-13-09-50-10-18-precheck.md`.\n'
          add='14. `t2-batches/batch-14-10-18-10-48-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe fourteenth precheck covers `10:18–10:48`. It supports the Narayanasamy–Sivaji sequence and records the machine-supported Rajendran boundary, but leaves `எஸ். எஸ்.`/join morphology, `பேசினால்/பேசினால்தான்`, `முதல் முதலாகச்/முதன் முதலாக`, and the corrupted Periyar/Anna stage-screen completion for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 10:48'
          git push origin main
