name: Audio 06 minutes 18-20 small cross-check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-18-20-small.yml

permissions:
  contents: read

jobs:
  chunks-18-20-small:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper
      - name: Download and verify
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://tamildigitallibrary.in/kalaignar/audio/06.Kalavaivannar%20N.S.Krishnnan%20Ninavul%20Naal%20Vizha%20Vil%20Kaligar%20Speech.mp3' \
            -o source.mp3
          echo '6f0149229196b1d6df092d9fee006253591afec7ba9512bfbeb46dd0ab82c836  source.mp3' | sha256sum -c
          ffmpeg -hide_banner -loglevel error -y -ss 1080 -i source.mp3 -t 120 \
            -af 'pan=mono|c0=c1' -ar 16000 -c:a pcm_s16le range.wav
      - name: Transcribe independent 30-second chunks
        run: |
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import subprocess, pathlib
          out=pathlib.Path('chunks-18-20-small'); out.mkdir(exist_ok=True)
          model=WhisperModel('small',device='cpu',compute_type='int8')
          for i,start in enumerate(range(0,120,30)):
              wav=out/f'chunk-{i}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i','range.wav','-t','30','-c:a','pcm_s16le',str(wav)],check=True)
              segs,info=model.transcribe(str(wav),language='ta',task='transcribe',beam_size=5,temperature=0.0,condition_on_previous_text=False,vad_filter=False)
              print(f'=== CHUNK {1080+start:04d}-{1080+start+30:04d} ===')
              for s in segs:
                  print(f'[{1080+start+s.start:08.2f}-{1080+start+s.end:08.2f}] {s.text.strip()}')
          PY
          python transcribe.py
