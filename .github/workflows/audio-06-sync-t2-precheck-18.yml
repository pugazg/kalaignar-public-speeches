name: Sync Audio 06 T2 precheck state 18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-18.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=18
          pre['latest_completed_range']='12:22-12:49'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-18-12-22-12-49-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Seventeen preparatory T2 records now exist:', 'Eighteen preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-17-12-00-12-22-precheck.md` — Kannadasan Krishna recommendation, central Krishna-joke conflict, temple-house remark and house-correction boundary.\n'
          add='- `t2-batches/batch-18-12-22-12-49-precheck.md` — house-purchase correction and mock-newspaper sequence, including corrupted political-status, place-name and mock-headline forms.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 18 supports `நான் வீடு கட்டவில்லை`, the twenty-years-earlier house-purchase correction, the newspaper-parody structure, and `கருணாநிதியின் நண்பர் கண்ணதாசனே குட்டை உடைத்துவிட்டார்`. It also establishes that the attachment transcript itself is badly corrupted at three crucial points: machine `முதலாளித்துவமான பிறகுதான்`, `கோவாலவரத்தில்`, and `மரண நம்பலமானது` do not verify the cleaner candidates `முதலமைச்சர் ஆன பிறகுதான்`, `கோபாலபுரத்திலே`, or `மர்மம் அம்பலமானது`. The press-style join, `தெரியுமா?`, `இதை கண்ணதாசனே வெளியிட்ட தகவல்`, and the exact `12:49` boundary remain for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Seventeen preparatory records are complete:', 'Eighteen preparatory records are complete:', 1)
          needle='17. `t2-batches/batch-17-12-00-12-22-precheck.md`.\n'
          add='18. `t2-batches/batch-18-12-22-12-49-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe eighteenth precheck covers `12:22–12:49`. It supports the house-purchase correction and newspaper-parody skeleton while explicitly preserving the major machine corruptions `முதலாளித்துவமான`, `கோவாலவரத்தில்`, and `மரண நம்பலமானது` against cleaner but unverified T1 candidates. The exact political/status phrase, place name, mock-headline wording and `12:49` transition require true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 12:49'
          git push origin main
