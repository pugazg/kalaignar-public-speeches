name: Sync Audio 06 T2 precheck state 22

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-22.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=22
          pre['latest_completed_range']='14:15-14:59'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-22-14-15-14-59-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty-one preparatory T2 records now exist:', 'Twenty-two preparatory T2 records now exist:', 1)
          needle='- `t2-batches/batch-21-14-00-14-15-precheck.md` — `பேரைப் / தேரைப்` remark conflict, agraharam residents\' agreement and the twenty-years-earlier house-purchase conclusion.\n'
          add='- `t2-batches/batch-22-14-15-14-59-precheck.md` — rationale for the house anecdote, changed ideological positions versus the continuing principle, gratitude to earlier workers and the Sivaji transition.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 22 maps `14:15–14:59`. Machine evidence strongly supports `அதே இடத்தில், அதே கொள்கையில் நின்று நிலைத்திராவிட்டாலும்`, `இந்த கொள்கை நிலைத்திருக்கிறதல்லவா?`, and a gratitude clause resembling `பாடுபட்டவர்களுக்கு நன்றி கூறுகிற இடத்திலே நான் இருக்கின்றேன்`, followed directly by the Sivaji stage-recollection boundary. It leaves the opening `கலை உலகம் / தலைஉலகம்` corruption, the phrase rendered as `நாம் பலர் ஆதாயம் பெற்றாவிட்டாலும்`, exact case/morphology, and the gratitude wording for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Twenty-one preparatory records are complete:', 'Twenty-two preparatory records are complete:', 1)
          needle='21. `t2-batches/batch-21-14-00-14-15-precheck.md`.\n'
          add='22. `t2-batches/batch-22-14-15-14-59-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-second precheck covers `14:15–14:59`. It supports the contrast between people no longer remaining in the same place/ideological position and the continuing principle, plus the speaker's gratitude toward those who worked for it and the transition into Sivaji's stage recollections. The noisy opening, the `ஆதாயம்` clause, exact ideological-position morphology and gratitude wording remain for true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 14:59'
          git push origin main
