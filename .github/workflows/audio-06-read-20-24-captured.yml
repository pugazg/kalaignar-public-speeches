name: Audio 06 read captured 20-24 artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-read-20-24-captured.yml

permissions:
  actions: read
  contents: read

jobs:
  read-captured-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior chunk artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh api repos/pugazg/kalaignar-public-speeches/actions/artifacts/9793079339/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          find artifact -maxdepth 2 -type f -print | sort
      - name: Print captured 20-24 candidate text
        run: |
          set -euxo pipefail
          echo '=== CAPTURED CHUNK 20:00-22:00 ==='
          cat artifact/chunk-10-1200-1320.txt
          echo '=== CAPTURED CHUNK 22:00-24:00 ==='
          cat artifact/chunk-11-1320-1440.txt
