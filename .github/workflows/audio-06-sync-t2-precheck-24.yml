name: Sync Audio 06 T2 precheck state 24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-precheck-24.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=24
          pre['latest_completed_range']='15:35-16:00'
          records=pre.setdefault('records',[])
          rec='t2-batches/batch-24-15-35-16-00-precheck.md'
          if rec not in records:
              records.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-three preparatory T2 records now exist:'
          new='Twenty-four preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-23-14-59-15-35-precheck.md` — Sivaji stage-work recollection, humorous reversal of who acted with whom, and the unpaid-performance statement.\n'
          add='- `t2-batches/batch-24-15-35-16-00-precheck.md` — relief/election-fund theatre work, unstable co-actor list, and the transition into the art-and-politics reflection.\n'
          if add not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatch 24 covers `15:35–16:00`. Machine evidence maps a fund-raising theatre list with clearer `வெள்ள நிவாரண நிதி` and `வரட்சி நிதி`, but leaves corrupted `பொய்யல் நிவாக நிதி` and `கலகத் தேர்தல் நிதி` for true replay. The co-actor sequence contains machine-corrupted `நம்முடைய ரக்சி நடிகர்களும்`, plus `டி.வி.என்`, `கே.ஆர். ராமசாமி`, `கவிஞர் அவர்களும்`, and a closing `வேடம் புனைந்திருக்கின்றார்கள்`. Play titles, the first co-actor/title, expanded identities and exact morphology remain unresolved. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Twenty-three preparatory records are complete:'
          new='Twenty-four preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='23. `t2-batches/batch-23-14-59-15-35-precheck.md`.\n'
          add='24. `t2-batches/batch-24-15-35-16-00-precheck.md`.\n'
          if add not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe twenty-fourth precheck covers `15:35–16:00`. It maps the fund-raising theatre sequence and co-actor list, preserving the corrupted fund labels and first co-actor/title phrase rather than normalizing them. `டி.வி.என்`, K. R. Ramasamy and a generic poet reference are useful machine anchors, but all exact identities, titles, play names and morphology require true audible replay. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 16:00'
          git push origin main
