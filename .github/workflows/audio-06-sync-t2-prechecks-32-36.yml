name: Sync Audio 06 T2 prechecks 32-36

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-06-sync-t2-prechecks-32-36.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize audit metadata and handover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('speeches/kalaivanar-nsk-memorial-day-audio-06')

          records=[
            't2-batches/batch-32-20-00-20-30-precheck.md',
            't2-batches/batch-33-20-30-21-04-precheck.md',
            't2-batches/batch-34-21-04-22-00-precheck.md',
            't2-batches/batch-35-22-00-22-52-precheck.md',
            't2-batches/batch-36-22-52-23-25-precheck.md',
          ]

          p=base/'metadata.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          pre=d.setdefault('t2_textual_precheck',{})
          pre['status']='in-progress'
          pre['batches_complete']=36
          pre['latest_completed_range']='22:52-23:25'
          arr=pre.setdefault('records',[])
          for rec in records:
              if rec not in arr:
                  arr.append(rec)
          pre['canonical_tamil_changes']=0
          pre['direct_listening_effect']='none; T2 counters remain 0 checked / 0 passed'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=base/'audit.md'
          s=p.read_text(encoding='utf-8')
          old='Thirty-one preparatory T2 records now exist:'
          new='Thirty-six preparatory T2 records now exist:'
          if old not in s: raise SystemExit('audit count marker missing')
          s=s.replace(old,new,1)
          needle='- `t2-batches/batch-31-19-33-20-00-precheck.md` — negative-evidence record for the malformed comparison/wordplay before the `20:00` `எச்சம்` clarification.\n'
          add=(
            '- `t2-batches/batch-32-20-00-20-30-precheck.md` — `எச்சம்` clarification, children/descendants distinction and unstable Valluvar explanation.\n'
            '- `t2-batches/batch-33-20-30-21-04-precheck.md` — Kalaivanar\'s ideas as enduring `எச்சம்`, memorial praise and the transition to the next recollection.\n'
            '- `t2-batches/batch-34-21-04-22-00-precheck.md` — Congress-conference recollection, `விலாங்கு மனிதன்`, hotelier role and collapsed hotel example.\n'
            '- `t2-batches/batch-35-22-00-22-52-precheck.md` — 1947 independence/radio setup, `சுதந்திர கீதத்தைப் பாடுங்கள்`, and withheld Kalaivanar/self-respect/Sivaji response.\n'
            '- `t2-batches/batch-36-22-52-23-25-precheck.md` — cross-party admirer list, Jeevanandam/Ma. Po. Si./Congress anchors and unresolved movement-preference contrast.\n'
          )
          if records[-1] not in s:
              if needle not in s: raise SystemExit('audit list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nBatches 32–36 extend textual preparation from `20:00` through `23:25`. Batch 32 keeps the `எச்சம்` interpretation source-dependent: `எச்சத்தால் காணப்படும்`, `பிள்ளைகளால்`, and `வள்ளுவர்` are usable anchors, but the descendants wording and intended-sense explanation remain unstable. Batch 33 more strongly supports `அவரைப் புகழ்வதும்`, `அவரைப் பாராட்டுவதும்`, `நகைச்சுவை மூலமாக`, and `எச்சங்களாகும்`. Batch 34 directly recovers `விலாங்கு மனிதன்`, Kalaivanar being invited for the play, and the hotelier role, while the event/place intro and the collapsed hotel example remain unresolved. Batch 35 directly recovers `சுதந்திர கீதத்தைப் பாடுங்கள்` but not the full 1947 setup, Kalaivanar response, self-respect wording or Sivaji reference. Batch 36 recovers `ஜீவானந்தம்`, `மா.பொ.சி.` and `காங்கிரஸ் கட்சியினுடைய தலைவர்கள்`, but the remaining affiliations and Kalaivanar's own movement-preference sentence remain for replay. No canonical Tamil was changed.\n'''
          marker='\nThese are textual/machine prechecks only. They do **not** change canonical Tamil and do **not** increment T2 direct-listening counters.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('audit marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')

          p=base/'HANDOVER.md'
          s=p.read_text(encoding='utf-8')
          old='Thirty-one preparatory records are complete:'
          new='Thirty-six preparatory records are complete:'
          if old not in s: raise SystemExit('handover count marker missing')
          s=s.replace(old,new,1)
          needle='31. `t2-batches/batch-31-19-33-20-00-precheck.md`.\n'
          add=(
            '32. `t2-batches/batch-32-20-00-20-30-precheck.md`.\n'
            '33. `t2-batches/batch-33-20-30-21-04-precheck.md`.\n'
            '34. `t2-batches/batch-34-21-04-22-00-precheck.md`.\n'
            '35. `t2-batches/batch-35-22-00-22-52-precheck.md`.\n'
            '36. `t2-batches/batch-36-22-52-23-25-precheck.md`.\n'
          )
          if '36. `t2-batches/batch-36-22-52-23-25-precheck.md`.' not in s:
              if needle not in s: raise SystemExit('handover list marker missing')
              s=s.replace(needle,needle+add,1)
          para='''\nThe thirty-second through thirty-sixth prechecks cover `20:00–23:25`. They map the `எச்சம்` clarification and legacy conclusion, preserve the unusual machine-supported `விலாங்கு மனிதன்` title without normalization, isolate the collapsed hotel example, preserve only the source-supported `சுதந்திர கீதத்தைப் பாடுங்கள்` anchor from the 1947 radio episode, and record the Jeevanandam/Ma. Po. Si./Congress admirer-list anchors without reconstructing political affiliations or Kalaivanar's movement preference. No canonical Tamil was changed.\n'''
          marker='\nThese records are **not** direct listening. T2 remains **0 checked / 0 passed**, and the true auditory sequence must still begin at `00:00`.\n'
          if para.strip() not in s:
              if marker not in s: raise SystemExit('handover marker missing')
              s=s.replace(marker,para+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          git add speeches/kalaivanar-nsk-memorial-day-audio-06/audit.md \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/metadata.json \
                  speeches/kalaivanar-nsk-memorial-day-audio-06/HANDOVER.md
          git commit -m 'Record Audio 06 T2 prechecks through 23:25'
          git push origin main
